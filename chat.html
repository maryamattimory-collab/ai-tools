<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:#e5e7eb;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

textarea, select, button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

button{
  background:#38bdf8;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.chat{
  margin-top:20px;
  background:#020617;
  padding:15px;
  border-radius:12px;
}

/* TAB UI */
.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:10px;
}

.tab-btn{
  background:#1e293b;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}

.tab-btn.active{
  background:#38bdf8;
}

.tab-content{
  display:none;
  background:#111827;
  padding:15px;
  border-radius:10px;
  white-space:pre-wrap;
}

.tab-content.active{
  display:block;
}
</style>
</head>

<body>

<div class="container">

<h2>AI Studio Pro 🚀</h2>

<select id="mode">
  <option value="auto">Auto</option>
  <option value="infographic">Infografis</option>
  <option value="tiktok">TikTok</option>
  <option value="leonardo">Leonardo</option>
  <option value="veo">Veo</option>
  <option value="analyze_video">Analyze Video</option>
</select>

<textarea id="prompt" placeholder="Tulis prompt..."></textarea>

<input type="file" id="videoFile" style="display:none">

<button onclick="sendPrompt()">Generate</button>

<div class="chat" id="chatBox"></div>

</div>

<script>
const modeSelect = document.getElementById("mode");
const videoFile = document.getElementById("videoFile");

modeSelect.addEventListener("change", () => {
  videoFile.style.display = modeSelect.value === "analyze_video" ? "block" : "none";
});

async function sendPrompt(){
  const mode = modeSelect.value;
  const prompt = document.getElementById("prompt").value;

  const chat = document.getElementById("chatBox");
  chat.innerHTML = "Loading...";

  if(mode === "analyze_video"){
    const file = videoFile.files[0];
    if(!file) return alert("Upload video dulu");

    const formData = new FormData();
    formData.append("video", file);
    formData.append("prompt", prompt);

    const res = await fetch("/api/analyze-video", {
      method:"POST",
      body:formData
    });

    const data = await res.json();
    renderTabs(data.text);
    return;
  }

  const res = await fetch("/api/generate", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ mode, prompt })
  });

  const data = await res.json();
  renderTabs(data.text);
}

/* 🔥 INI BAGIAN PENTING */
function renderTabs(text){
  const chat = document.getElementById("chatBox");

  const sections = text.split(/###\s+/).filter(s => s.trim());

  let tabs = `<div class="tabs">`;
  let content = "";

  sections.forEach((sec, i) => {
    const lines = sec.split("\n");
    const title = lines[0];
    const body = lines.slice(1).join("\n");

    tabs += `<div class="tab-btn ${i===0?"active":""}" onclick="openTab(${i})">${title}</div>`;

    content += `
      <div class="tab-content ${i===0?"active":""}" id="tab-${i}">
        ${body}
      </div>
    `;
  });

  tabs += "</div>";

  chat.innerHTML = tabs + content;
}

function openTab(i){
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));

  document.querySelectorAll(".tab-btn")[i].classList.add("active");
  document.getElementById("tab-"+i).classList.add("active");
}
</script>

</body>
</html>
