<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title><style>

body{
background:#0f172a;
color:white;
font-family:Arial;
margin:0;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

h1{
margin-bottom:6px;
}

.sub{
color:#cbd5e1;
margin-bottom:20px;
}

.panel{
background:#1e293b;
padding:16px;
border-radius:14px;
margin-bottom:16px;
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:10px;
}

select,input,textarea{
width:100%;
padding:10px;
border-radius:8px;
border:none;
}

textarea{
min-height:110px;
}

button{
padding:10px 14px;
border:none;
border-radius:8px;
background:#38bdf8;
color:white;
cursor:pointer;
}

.chat{
background:#020617;
padding:16px;
border-radius:14px;
min-height:280px;
}

.bubble{
padding:14px;
border-radius:12px;
margin-top:10px;
white-space:pre-wrap;
line-height:1.5;
}

.user{
background:#2563eb;
text-align:right;
margin-left:auto;
max-width:80%;
}

.ai{
background:#1e293b;
margin-right:auto;
max-width:80%;
}

.tools{
margin-top:10px;
}

.tools button{
margin-right:8px;
margin-top:6px;
}

</style></head><body><div class="container"><h1>AI Studio Pro</h1>
<div class="sub">Infografis • TikTok Carousel • Leonardo Prompt • Veo Prompt</div><div class="panel"><div class="row">
<select id="mode">
<option value="infographic">Infografis</option>
<option value="tiktok">TikTok Carousel</option>
<option value="leonardo">Prompt Leonardo</option>
<option value="veo">Prompt Veo</option>
</select>
</div><div class="row">
<textarea id="prompt" placeholder="Tulis topik atau perintah..."></textarea>
</div><div class="row">
<button onclick="sendPrompt()">Generate</button>
</div></div><div class="chat" id="chatBox"></div></div><script>

let lastText=""
let lastJSON=null

function addBubble(role,text){

const chat=document.getElementById("chatBox")

const bubble=document.createElement("div")

bubble.className="bubble "+(role==="user"?"user":"ai")

bubble.innerText=text

chat.appendChild(bubble)

chat.scrollTop=chat.scrollHeight

return bubble

}

async function sendPrompt(){

const mode=document.getElementById("mode").value
const prompt=document.getElementById("prompt").value.trim()

if(!prompt){
alert("Prompt kosong")
return
}

addBubble("user",prompt)

const aiBubble=addBubble("ai","Memproses...")

try{

const res=await fetch("/api/gemini-chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

message:`Mode:${mode}

Topik:${prompt}

Gunakan tool yang sesuai dengan mode.`

})

})

const data=await res.json()

lastJSON=data

const output=

data.result?.text ||
data.result?.message ||
data.result?.result ||
data.message ||
JSON.stringify(data,null,2)

lastText=output

aiBubble.innerHTML=

escapeHtml(output).replace(/\n/g,"<br>") +

`<div class="tools">

<button onclick="copyText()">Salin</button>
<button onclick="downloadTxt()">Download TXT</button>
<button onclick="downloadJson()">Download JSON</button>

</div>`

}catch(err){

aiBubble.innerText="Error: "+err.message

}

}

function copyText(){

navigator.clipboard.writeText(lastText)

alert("Teks disalin")

}

function downloadTxt(){

const blob=new Blob([lastText],{type:"text/plain"})

const a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="hasil-ai.txt"

a.click()

}

function downloadJson(){

const blob=new Blob([JSON.stringify(lastJSON,null,2)],{type:"application/json"})

const a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="hasil-ai.json"

a.click()

}

function escapeHtml(str){

return str
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")

}

</script></body>
</html>
