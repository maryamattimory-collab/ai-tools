<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>AI Studio Pro</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

select, textarea, input, button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: #22c55e;
  color: white;
  cursor: pointer;
}

#videoUpload {
  display: none;
}

#analyzeStyle {
  display: none;
}
</style>
</head>

<body>
<div class="container">

<h2>AI Studio Pro</h2>

<select id="mode">
  <option value="auto">Auto</option>
  <option value="infographic">Infografis</option>
  <option value="tiktok">TikTok</option>
  <option value="leonardo">Leonardo</option>
  <option value="veo">Veo</option>
  <option value="analyze_video">Analyze Video</option>
</select>

<textarea id="prompt" placeholder="Tulis prompt kamu..."></textarea>

<div id="videoUpload">
  <input type="file" id="videoFile" accept="video/*">

  <select id="analyzeStyle">
    <option value="original">Ikuti Alur Asli</option>
    <option value="storytelling">Storytelling Ulang</option>
    <option value="hybrid">Gabungan</option>
  </select>
</div>

<button onclick="sendPrompt()">Generate</button>

<pre id="result"></pre>

</div>

<script>
const modeSelect = document.getElementById("mode");
const videoUpload = document.getElementById("videoUpload");
const analyzeStyle = document.getElementById("analyzeStyle");

modeSelect.addEventListener("change", () => {
  if (modeSelect.value === "analyze_video") {
    videoUpload.style.display = "block";
    analyzeStyle.style.display = "block";
  } else {
    videoUpload.style.display = "none";
    analyzeStyle.style.display = "none";
  }
});

async function sendPrompt() {
  const mode = modeSelect.value;
  const prompt = document.getElementById("prompt").value;
  const resultBox = document.getElementById("result");

  resultBox.textContent = "Loading...";

  try {
    if (mode === "analyze_video") {
      const file = document.getElementById("videoFile").files[0];
      const style = analyzeStyle.value;

      const formData = new FormData();
      formData.append("video", file);
      formData.append("prompt", prompt);
      formData.append("style", style);

      const res = await fetch("/api/analyze-video", {
        method: "POST",
        body: formData
      });

      const data = await res.json();
      resultBox.textContent = data.text;

    } else {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          mode,
          prompt
        })
      });

      const data = await res.json();
      resultBox.textContent = data.text;
    }

  } catch (err) {
    resultBox.textContent = "Error: " + err.message;
  }
}
</script>

</body>
</html>
