<!DOCTYPE html>
<html>
<head>
<title>AI Studio Pro</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
display:grid;
grid-template-columns:350px 1fr;
gap:20px;
}

.panel{
background:#111827;
padding:20px;
border-radius:12px;
}

textarea,select{
width:100%;
padding:10px;
border-radius:8px;
border:none;
margin-top:5px;
}

button{
padding:10px 14px;
border:none;
border-radius:8px;
background:#3b82f6;
color:white;
cursor:pointer;
margin-top:10px;
}

.chat{
background:#020617;
padding:20px;
border-radius:12px;
min-height:500px;
overflow:auto;
}

.bubble{
margin-top:10px;
padding:10px;
border-radius:10px;
}

.user{
background:#2563eb;
text-align:right;
}

.ai{
background:#1e293b;
}

</style>

</head>

<body>

<div class="container">

<div class="panel">

<h2>AI Studio Pro</h2>

<label>Mode</label>

<select id="mode">
<option value="infographic">Infografis</option>
<option value="tiktok">TikTok Carousel</option>
<option value="leonardo">Leonardo Prompt</option>
<option value="veo">Veo Video Prompt</option>
</select>

<label>Topik</label>

<textarea id="prompt" rows="6"></textarea>

<button onclick="sendPrompt()">Generate</button>

</div>


<div class="panel">

<div class="chat" id="chat"></div>

</div>

</div>

<script>

async function sendPrompt(){

const mode=document.getElementById("mode").value;
const prompt=document.getElementById("prompt").value;

const chat=document.getElementById("chat");

const user=document.createElement("div");
user.className="bubble user";
user.innerText=prompt;
chat.appendChild(user);

const ai=document.createElement("div");
ai.className="bubble ai";
ai.innerText="Memproses...";
chat.appendChild(ai);

const res=await fetch("/api/generate",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
mode,
prompt
})
});

const data=await res.json();

ai.innerText=data.text;

chat.scrollTop=chat.scrollHeight;

}

</script>

</body>
</html>
