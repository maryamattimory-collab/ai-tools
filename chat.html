<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:#e5e7eb;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

textarea, select, button, input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

button{
  background:#38bdf8;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.chat{
  margin-top:20px;
  background:#020617;
  padding:15px;
  border-radius:12px;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">

<h2>AI Studio Pro 🚀</h2>

<select id="mode">
  <option value="auto">Auto</option>
  <option value="infographic">Infografis</option>
  <option value="tiktok">TikTok</option>
  <option value="leonardo">Leonardo</option>
  <option value="veo">Veo</option>
  <option value="analyze_video">Analyze Video</option>
</select>

<textarea id="prompt" placeholder="Tulis prompt..."></textarea>

<input type="file" id="videoFile" style="display:none">

<!-- 🔥 TAMBAHAN BARU (TIDAK MERUSAK UI) -->
<select id="analyzeStyle" style="display:none">
  <option value="original">Ikuti Alur Asli</option>
  <option value="storytelling">Storytelling Ulang</option>
  <option value="hybrid">Hybrid</option>
</select>

<button onclick="sendPrompt()">Generate</button>

<div class="chat" id="chatBox"></div>

</div>

<script>
const modeSelect = document.getElementById("mode");
const videoFile = document.getElementById("videoFile");
const analyzeStyle = document.getElementById("analyzeStyle");

// tampilkan input sesuai mode
modeSelect.addEventListener("change", () => {
  const isAnalyze = modeSelect.value === "analyze_video";

  videoFile.style.display = isAnalyze ? "block" : "none";
  analyzeStyle.style.display = isAnalyze ? "block" : "none";
});

async function sendPrompt(){
  const mode = modeSelect.value;
  const prompt = document.getElementById("prompt").value;

  const chat = document.getElementById("chatBox");
  chat.innerHTML = "Loading...";

  if(mode === "analyze_video"){
    const file = videoFile.files[0];
    if(!file) return alert("Upload video dulu");

    const style = analyzeStyle.value;

    const formData = new FormData();
    formData.append("video", file);
    formData.append("prompt", prompt);
    formData.append("style", style); // 🔥 kirim pilihan

    const res = await fetch("/api/analyze-video", {
      method:"POST",
      body:formData
    });

    const data = await res.json();
    chat.innerHTML = data.text;
    return;
  }

  const res = await fetch("/api/generate", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ mode, prompt })
  });

  const data = await res.json();
  chat.innerHTML = data.text;
}
</script>

</body>
</html>
