<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Studio Pro</title>
  <style>
    body{
      margin:0;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#0f172a;
      color:white;
    }
    .container{max-width:900px;margin:auto;}
    .panel{background:#1e293b;padding:16px;border-radius:14px;margin-bottom:16px;}
    .row{margin-bottom:12px;}
    select, textarea, input, button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      box-sizing:border-box;
      font-size:14px;
    }
    select, textarea, input{
      background:#f8fafc;
      color:#111827;
    }
    textarea{min-height:120px;resize:vertical;}
    button{
      width:auto;
      background:#38bdf8;
      color:white;
      cursor:pointer;
      font-weight:bold;
      padding:10px 16px;
      margin-top:6px;
    }
    .chat{
      background:#020617;
      padding:16px;
      border-radius:14px;
      min-height:280px;
    }
    .bubble{
      padding:14px;
      border-radius:12px;
      margin-top:10px;
      white-space:pre-wrap;
      line-height:1.5;
      max-width:80%;
    }
    .user{background:#2563eb;margin-left:auto;text-align:right;}
    .ai{background:#1e293b;margin-right:auto;}
    .small-btn{
      background:#334155;
      font-size:13px;
      padding:8px 12px;
      margin-right:8px;
      margin-top:6px;
    }
    .prompt-tools{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    label{
      display:block;
      margin-bottom:6px;
      color:#cbd5e1;
      font-size:14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Studio Pro</h1>

    <div class="panel">
      <div class="row">
        <label for="mode">Pilih Mode</label>
        <select id="mode">
          <option value="infographic">Infografis</option>
          <option value="tiktok">TikTok Carousel</option>
          <option value="leonardo">Prompt Leonardo</option>
          <option value="veo">Prompt Veo</option>
          <option value="analyze_video">Analyze Video</option>
          <option value="combine_photos">Gabungkan Foto</option>
        </select>
      </div>

      <div class="row">
        <label for="prompt">Topik / Perintah</label>
        <textarea id="prompt" placeholder="Tulis topik atau perintah..."></textarea>
      </div>

      <div class="row" id="videoTools" style="display:none;">
        <label>Prompt Otomatis Analyze Video</label>
        <div class="prompt-tools">
          <button type="button" class="small-btn" onclick="setPrompt('Analisa video ini menjadi scene by scene prompt cinematic untuk Veo')">Scene by scene Veo</button>
          <button type="button" class="small-btn" onclick="setPrompt('Analisa video ini lalu buat deskripsi angle kamera, lighting, dan mood per scene')">Kamera + lighting</button>
          <button type="button" class="small-btn" onclick="setPrompt('Analisa video ini dan ubah menjadi storyboard singkat + prompt Leonardo per scene')">Storyboard + Leonardo</button>
        </div>
      </div>

      <div class="row" id="photoTools" style="display:none;">
        <label>Prompt Otomatis Gabungkan Foto</label>
        <div class="prompt-tools">
          <button type="button" class="small-btn" onclick="setPrompt('Gabungkan foto-foto ini menjadi satu konsep visual cinematic yang harmonis')">Gabung cinematic</button>
          <button type="button" class="small-btn" onclick="setPrompt('Gabungkan foto-foto ini menjadi prompt Leonardo AI yang detail')">Jadi prompt Leonardo</button>
          <button type="button" class="small-btn" onclick="setPrompt('Gabungkan foto-foto ini menjadi konsep poster atau thumbnail yang rapi')">Poster / thumbnail</button>
        </div>
      </div>

      <div class="row" id="videoUpload" style="display:none;">
        <label for="videoFile">Upload Video Referensi</label>
        <input type="file" id="videoFile" accept="video/*">
      </div>

      <div class="row" id="photoUpload" style="display:none;">
        <label for="photoFiles">Upload Foto</label>
        <input type="file" id="photoFiles" accept="image/*" multiple>
      </div>

      <div class="row">
        <button type="button" onclick="sendPrompt()">Generate</button>
      </div>
    </div>

    <div class="chat" id="chatBox"></div>
  </div>

  <script>
    let lastText = "";
    let lastJSON = null;

    const modeSelect = document.getElementById("mode");
    const videoUpload = document.getElementById("videoUpload");
    const photoUpload = document.getElementById("photoUpload");
    const videoTools = document.getElementById("videoTools");
    const photoTools = document.getElementById("photoTools");

    function updateUploadUI(){
      const mode = modeSelect.value;

      videoUpload.style.display = "none";
      photoUpload.style.display = "none";
      videoTools.style.display = "none";
      photoTools.style.display = "none";

      if(mode === "analyze_video"){
        videoUpload.style.display = "block";
        videoTools.style.display = "block";
      }

      if(mode === "combine_photos"){
        photoUpload.style.display = "block";
        photoTools.style.display = "block";
      }
    }

    modeSelect.addEventListener("change", updateUploadUI);
    updateUploadUI();

    function setPrompt(text){
      document.getElementById("prompt").value = text;
    }

    function addBubble(role, text){
      const chat = document.getElementById("chatBox");
      const bubble = document.createElement("div");
      bubble.className = "bubble " + (role === "user" ? "user" : "ai");
      bubble.innerText = text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    async function sendPrompt(){
      const mode = document.getElementById("mode").value;
      const prompt = document.getElementById("prompt").value.trim();

      if(!prompt){
        alert("Prompt kosong");
        return;
      }

      let extraInfo = "";

      if(mode === "analyze_video"){
        const videoFile = document.getElementById("videoFile").files[0];
        if (videoFile) extraInfo = "Nama file video: " + videoFile.name;
      }

      if(mode === "combine_photos"){
        const files = document.getElementById("photoFiles").files;
        if (files.length > 0) extraInfo = "Jumlah foto: " + files.length;
      }

      addBubble("user", prompt);
      const aiBubble = addBubble("ai", "Memproses...");

      try {
        const res = await fetch("/api/gemini-chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: prompt + (extraInfo ? "\n" + extraInfo : ""),
            mode: mode
          })
        });

        const data = await res.json();
        lastJSON = data;

        const output =
          data.text ||
          data.error ||
          JSON.stringify(data, null, 2);

        lastText = output;
        aiBubble.innerText = output;
      } catch (err) {
        aiBubble.innerText = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
