<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Studio Pro</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

textarea{
width:100%;
height:120px;
padding:10px;
border-radius:8px;
border:none;
}

select{
padding:8px;
border-radius:8px;
}

button{
padding:10px 16px;
border:none;
border-radius:8px;
background:#38bdf8;
color:white;
cursor:pointer;
margin-top:10px;
}

.chat{
margin-top:20px;
}

.bubble{
padding:14px;
border-radius:12px;
margin-top:10px;
white-space:pre-wrap;
}

.user{
background:#2563eb;
text-align:right;
}

.ai{
background:#1e293b;
}
</style>
</head>

<body>

<div class="container">

<h2>AI Studio Pro</h2>

<select id="mode">
<option value="infographic">Infografis</option>
<option value="tiktok">TikTok Carousel</option>
<option value="leonardo">Prompt Leonardo</option>
<option value="veo">Prompt Veo</option>
</select>

<br><br>

<textarea id="prompt" placeholder="Tulis perintah..."></textarea>

<br>

<button onclick="sendPrompt()">Kirim</button>

<div class="chat" id="chat"></div>

</div>

<script>

let lastText="";

function addBubble(text,type){

const div=document.createElement("div");

div.className="bubble "+type;

div.innerText=text;

document.getElementById("chat").appendChild(div);

}

async function sendPrompt(){

const prompt=document.getElementById("prompt").value;

const mode=document.getElementById("mode").value;

addBubble(prompt,"user");

const res=await fetch("https://thriving-harmony-production-76ec.up.railway.app/api/gemini-chat",{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

message:`Mode:${mode}
Topik:${prompt}

Jika mode veo gunakan tool generate_veo_prompt
Jika mode leonardo gunakan tool generate_leonardo_prompt
Jika mode tiktok gunakan tool generate_tiktok_carousel
Jika mode infographic gunakan tool generate_infographic`

})

});

const data=await res.json();

const text=

data.result?.text ||

data.reply ||

data.message ||

data.text ||

JSON.stringify(data,null,2);

lastText=text;

addBubble(text,"ai");

}

</script>

</body>
</html>
