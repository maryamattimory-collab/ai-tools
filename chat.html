<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Studio Pro</title>

  <style>
    body{
      margin:0;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#0f172a;
      color:white;
    }

    .container{
      max-width:900px;
      margin:auto;
    }

    h1{
      margin-bottom:6px;
    }

    .sub{
      color:#cbd5e1;
      margin-bottom:20px;
    }

    .panel{
      background:#1e293b;
      padding:16px;
      border-radius:14px;
      margin-bottom:16px;
    }

    .row{
      margin-bottom:12px;
    }

    select,
    textarea,
    input,
    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      box-sizing:border-box;
      font-size:14px;
    }

    select,
    textarea,
    input{
      background:#f8fafc;
      color:#111827;
    }

    textarea{
      min-height:120px;
      resize:vertical;
    }

    button{
      width:auto;
      background:#38bdf8;
      color:white;
      cursor:pointer;
      font-weight:bold;
      padding:10px 16px;
    }

    .chat{
      background:#020617;
      padding:16px;
      border-radius:14px;
      min-height:280px;
    }

    .bubble{
      padding:14px;
      border-radius:12px;
      margin-top:10px;
      white-space:pre-wrap;
      line-height:1.5;
      max-width:80%;
    }

    .user{
      background:#2563eb;
      margin-left:auto;
      text-align:right;
    }

    .ai{
      background:#1e293b;
      margin-right:auto;
    }

    .tools{
      margin-top:10px;
    }

    .tools button{
      margin-right:8px;
      margin-top:6px;
    }

    label{
      display:block;
      margin-bottom:6px;
      color:#cbd5e1;
      font-size:14px;
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>AI Studio Pro</h1>

<div class="sub">
Infografis • TikTok Carousel • Leonardo Prompt • Veo Prompt • Analyze Video • Gabungkan Foto
</div>

<div class="panel">

<div class="row">
<label>Pilih Mode</label>

<select id="mode">
<option value="infographic">Infografis</option>
<option value="tiktok">TikTok Carousel</option>
<option value="leonardo">Prompt Leonardo</option>
<option value="veo">Prompt Veo</option>
<option value="analyze_video">Analyze Video</option>
<option value="combine_photos">Gabungkan Foto</option>
</select>

</div>

<div class="row">
<textarea id="prompt" placeholder="Tulis topik atau perintah..."></textarea>
</div>

<button id="autoPromptBtn" type="button" style="display:none;margin-top:10px;">
✨ Buat Prompt Otomatis
</button>  

  <div id="videoUpload" style="display:none;margin-top:10px;">
<label>Upload Video Referensi</label>
<input type="file" id="videoFile" accept="video/*">
</div>

<div id="photoUpload" style="display:none;margin-top:10px;">
<label>Upload Foto (bisa pilih beberapa)</label>
<input type="file" id="photoFiles" accept="image/*" multiple>
</div>

<div class="row">
<button onclick="sendPrompt()">Generate</button>
</div>

</div>

<div class="chat" id="chatBox"></div>

</div>

<script>

let lastText=""
let lastJSON=null

const modeSelect=document.getElementById("mode")
const videoUpload=document.getElementById("videoUpload")
const photoUpload=document.getElementById("photoUpload")
const autoPromptBtn = document.getElementById("autoPromptBtn")

function updateUpload(){

videoUpload.style.display="none"
photoUpload.style.display="none"
autoPromptBtn.style.display="none"

let mode = modeSelect.value

if(mode === "analyze_video"){
  videoUpload.style.display = "block"
  autoPromptBtn.style.display = "inline-block"
}

if(mode === "combine_photos"){
  photoUpload.style.display = "block"
  autoPromptBtn.style.display = "inline-block"
}

}

}

modeSelect.addEventListener("change",updateUpload)

function addBubble(role,text){

const chat=document.getElementById("chatBox")

const bubble=document.createElement("div")
bubble.className="bubble "+(role==="user"?"user":"ai")

bubble.innerText=text

chat.appendChild(bubble)

chat.scrollTop=chat.scrollHeight

return bubble

}

async function sendPrompt(){

let mode=document.getElementById("mode").value
let prompt=document.getElementById("prompt").value.trim()

if(!prompt){
alert("Prompt kosong")
return
}

addBubble("user",prompt)

let aiBubble=addBubble("ai","Memproses...")

try{

let res=await fetch("/api/gemini-chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:prompt,
mode:mode
})
})

let data=await res.json()

lastJSON=data

let output=
data.result?.text ||
data.result?.message ||
data.message ||
JSON.stringify(data,null,2)

lastText=output

aiBubble.innerHTML=
output.replace(/\n/g,"<br>")+
`
<div class="tools">
<button onclick="copyText()">Salin</button>
<button onclick="downloadTxt()">Download TXT</button>
<button onclick="downloadJson()">Download JSON</button>
</div>
`

}catch(err){

aiBubble.innerText="Error: "+err.message

}

}

function copyText(){

navigator.clipboard.writeText(lastText)

alert("Teks disalin")

}

function downloadTxt(){

const blob=new Blob([lastText],{type:"text/plain"})

const a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="hasil-ai.txt"

a.click()

}

function downloadJson(){

const blob=new Blob([JSON.stringify(lastJSON,null,2)],{type:"application/json"})

const a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="hasil-ai.json"

a.click()

}

</script>

</body>
</html>
