<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Studio Pro Chat</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
padding:40px;
}

.container{
max-width:700px;
margin:auto;
}

textarea{
width:100%;
height:100px;
padding:10px;
border-radius:8px;
border:none;
margin-top:10px;
}

button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:8px;
background:#3b82f6;
color:white;
cursor:pointer;
}

.result{
margin-top:20px;
padding:20px;
background:#1e293b;
border-radius:10px;
white-space:pre-wrap;
}
</style>

</head>

<body>

<div class="container">

<h2>AI Studio Pro Chat</h2>

<textarea id="prompt" placeholder="Tulis perintah..."></textarea>

<button onclick="sendPrompt()">Kirim</button>

<div id="result" class="result"></div>

</div>

<script>

async function sendPrompt(){

const prompt = document.getElementById("prompt").value;

document.getElementById("result").innerText = "Memproses...";

const res = await fetch("https://thriving-harmony-production-76ec.up.railway.app/api/gemini-chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({message:prompt})
});

const data = await res.json();

const text = data.result?.text || data.reply || data.result || data.text || JSON.stringify(data,null,2);

document.getElementById("result").innerHTML =
text + '<br><br><button onclick="copyText()">Salin</button>';

window.lastResult = text;
}

function copyText(){
navigator.clipboard.writeText(window.lastResult);
alert("Teks berhasil disalin!");
}
</script>

}
</body>
</html>
