<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.container{
text-align:center;
max-width:700px;
padding:40px;
}

h1{
font-size:48px;
margin-bottom:10px;
}

.sub{
color:#94a3b8;
margin-bottom:30px;
}

.card{
background:#1e293b;
padding:30px;
border-radius:16px;
margin-bottom:25px;
}

.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:30px;
}

.feature{
background:#020617;
padding:12px;
border-radius:8px;
font-size:14px;
}

button{
background:#38bdf8;
border:none;
padding:14px 28px;
font-size:16px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
}

button:hover{
background:#0ea5e9;
}

.footer{
margin-top:20px;
color:#64748b;
font-size:13px;
}

</style>
</head>

<body>

<div class="container">

<h1>AI Studio Pro</h1>

<div class="sub">
Tools AI untuk membuat konten visual, prompt video, dan analisa konten otomatis
</div>

<div class="card">

<div class="features">

<div class="feature">Infografis Generator</div>
<div class="feature">TikTok Carousel</div>
<div class="feature">Leonardo Prompt</div>
<div class="feature">Veo Video Prompt</div>
<div class="feature">Analyze Video</div>
<div class="feature">Gabungkan Foto</div>

</div>

<a href="/chat.html">
<button>Masuk ke AI Tools</button>
</a>

</div>

<div class="footer">
AI Studio Pro • Powered by Gemini
</div>

</div>

</body>
</html>
