<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}
.container{
text-align:center;
max-width:700px;
padding:40px;
}
.card{
background:#1e293b;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}
input, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
}
button{
background:#38bdf8;
border:none;
padding:12px;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;
}
.output{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;
white-space:pre-line;
}
</style>

</head>

<body>

<div class="container">

<h1>🎬 AI Content & Ads Generator</h1>

<div class="card">

<h3>🎯 Pilih Mode</h3>
<select id="mode" onchange="ubahMode()">
<option value="film" selected>🎬 Film</option>
<option value="iklan">💰 Iklan</option>
</select>

<!-- 🎬 FILM -->

<div id="filmFields">

<input type="text" id="judul" placeholder="Judul Cerita">
<input type="text" id="tema" placeholder="Tema">

<select id="scene">
<option value="3">3 Scene</option>
<option value="5">5 Scene</option>
<option value="7">7 Scene</option>
<option value="10">10 Scene</option>
</select>

<select id="emosi">
<option>Sedih</option>
<option>Haru</option>
<option>Bahagia</option>
<option>Religius</option>
<option>Tegang</option>
</select>

<select id="karakter">
<option>Ibu & Anak</option>
<option>Anak</option>
<option>Remaja</option>
<option>Hewan</option>
</select>

<select id="style">
<option>3D Pixar</option>
<option>Anime</option>
<option>Realistis Cinematic</option>
<option>Kartun Anak</option>
<option>Studio Ghibli</option>
</select>

<button onclick="generate()">🎬 Buat Film</button>

</div>

<!-- 💰 IKLAN -->

<div id="iklanFields" style="display:none;">

<input type="text" id="produk" placeholder="Nama Produk">

<select id="target">
<option>Ibu Rumah Tangga</option>
<option>Remaja</option>
<option>Anak Muda</option>
<option>Umum</option>
</select>

<select id="gender">
<option>Perempuan</option>
<option>Laki-laki</option>
</select>

<select id="styleAds">
<option>3D Pixar</option>
<option>Anime</option>
<option>Realistis Cinematic</option>
</select>

<button onclick="generateAds()">💰 Buat Iklan</button>

</div>

<div id="output" class="output"></div>

</div>

</div>

<script>

function ubahMode(){
let mode = document.getElementById("mode").value;

if(mode === "film"){
document.getElementById("filmFields").style.display = "block";
document.getElementById("iklanFields").style.display = "none";
}else{
document.getElementById("filmFields").style.display = "none";
document.getElementById("iklanFields").style.display = "block";
}
}

window.onload = ubahMode;

// 🎬 FILM
function generate(){

let judul = document.getElementById('judul').value || "Tanpa Judul";
let tema = document.getElementById('tema').value || "Tema Umum";
let totalScene = parseInt(document.getElementById('scene').value);
let emosi = document.getElementById('emosi').value;
let karakter = document.getElementById('karakter').value;
let style = document.getElementById('style').value;

let hasil = `🎬 ${judul}\n\nStyle: ${style}\nTema: ${tema}\n\n`;

for(let i=1;i<=totalScene;i++){
hasil += `SCENE ${i}\n`;
hasil += `Visual: ${karakter}, ${tema}, ${style}\n`;
hasil += `Voice Over: Narasi ${emosi}\n\n`;
}

document.getElementById("output").innerText = hasil;
}

// 💰 IKLAN
function generateAds(){

let produk = document.getElementById('produk').value || "Produk";
let target = document.getElementById('target').value;
let gender = document.getElementById('gender').value;
let style = document.getElementById('styleAds').value;

let hasil = `💰 IKLAN ${produk}\n\nTarget: ${target}\n\n`;

hasil += `Hook:\n"${target}, pernah ngerasa ${produk} kurang efektif?"\n\n`;
hasil += `Masalah:\nMasih banyak yang bingung\n\n`;
hasil += `Solusi:\nSekarang lebih mudah pakai ${produk}\n\n`;
hasil += `CTA:\nCoba sekarang!\n\n`;

hasil += `🎬 FORMAT VIDEO:\n\n`;

hasil += `Scene 1: ${gender} bingung\n`;
hasil += `Scene 2: Masalah muncul\n`;
hasil += `Scene 3: Pakai ${produk}\n`;
hasil += `Scene 4: Hasil bagus\n`;
hasil += `Scene 5: CTA\n`;

document.getElementById("output").innerText = hasil;
}

</script>

</body>
</html>
