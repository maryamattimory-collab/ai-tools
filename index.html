<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title><style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
text-align:center;
max-width:700px;
padding:40px;
}

h1{font-size:42px;margin-bottom:10px;}
.sub{color:#94a3b8;margin-bottom:25px;}

.card{
background:#1e293b;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}

.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}

.feature{
background:#020617;
padding:10px;
border-radius:8px;
font-size:13px;
color:#94a3b8;
}

input, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
outline:none;
}

button{
background:#38bdf8;
border:none;
padding:14px 20px;
font-size:15px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
margin:5px;
}

button:hover{background:#0ea5e9;}

.output{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;
white-space:pre-line;
font-size:14px;
}

.footer{
margin-top:15px;
color:#64748b;
font-size:12px;
}
</style></head><body><div class="container"><h1>🎬 AI Studio Pro</h1><div class="sub">
Generate film, iklan, edukasi + AI tools lengkap
</div><div class="card"><h3>🔥 Quick Preset:</h3>
<button onclick="preset('Anak Durhaka','Sedih')">Anak Durhaka</button>
<button onclick="preset('Ibu Sabar','Haru')">Ibu Sabar</button>
<button onclick="preset('Anak Menyesal','Sedih')">Anak Menyesal</button>
<button onclick="preset('Cerita Islami','Religius')">Islami</button>
<button onclick="preset('Cerita Horor','Tegang')">Horor</button><br><br>

<input type="text" id="judul" placeholder="Judul Cerita">
<input type="text" id="tema" placeholder="Tema"><select id="mode">
<option value="film" selected>🎬 AI Film</option>
<option value="iklan">💰 AI Iklan</option>
<option value="edukasi">🧠 AI Edukasi</option>
</select><select id="scene">
<option value="3" selected>3 Scene</option>
<option value="5">5 Scene</option>
<option value="7">7 Scene</option>
</select><select id="emosi">
<option>Sedih</option>
<option>Haru</option>
<option>Bahagia</option>
<option>Religius</option>
<option>Tegang</option>
</select><select id="karakter">
<option>Ibu & Anak</option>
<option>Anak</option>
<option>Remaja</option>
<option>Hewan</option>
<option>Food Object</option>
<option>Fruit Object</option>
</select><select id="style">
<option selected>3D Pixar</option>
<option>Anime</option>
<option>Realistis Cinematic</option>
<option>Kartun Anak</option>
<option>Studio Ghibli</option>
<option>Skeleton</option>
<option>Food Character</option>
</select><select id="aitools">
<option value="none" selected>AI Tools: None</option>
<option value="t2i">Text to Image</option>
<option value="i2v">Image to Video</option>
<option value="voice">Voice Over</option>
<option value="lip">AI Lip Sync</option>
<option value="prompt">Prompt Generator</option>
</select><button onclick="generate()">🎬 Generate</button>

<div id="output" class="output"></div></div><div class="card">
<h4>Tools Lainnya</h4>
<div class="features">
<div class="feature">Infografis Generator</div>
<div class="feature">TikTok Carousel</div>
<div class="feature">Leonardo Prompt</div>
<div class="feature">Veo Video Prompt</div>
<div class="feature">Analyze Video</div>
<div class="feature">Gabungkan Foto</div>
</div>
</div></div><script>

function preset(judul, emosi){
document.getElementById('judul').value = judul;
document.getElementById('tema').value = judul;
document.getElementById('emosi').value = emosi;
}

function generate(){

const judul = document.getElementById('judul').value;
const tema = document.getElementById('tema').value;
const sceneCount = parseInt(document.getElementById('scene').value);
const emosi = document.getElementById('emosi').value;
const karakter = document.getElementById('karakter').value;
const style = document.getElementById('style').value;
const mode = document.getElementById('mode').value;
const aitools = document.getElementById('aitools').value;

let visualBase = `${karakter}, ${style}, cinematic lighting, depth of field, 35mm film look`;

// EDUKASI OBJECT TALK
if(mode === "edukasi"){
visualBase = `${karakter} as anthropomorphic object (food/fruit), talking like human, expressive face, educational scene, bright lighting, colorful background`;
}

let hook = "";

if(mode === "edukasi"){
hook = "Belajar jadi lebih seru dengan karakter objek yang bisa berbicara...";
}else if(mode === "film"){
hook = "Ini bukan sekadar cerita... ini perjalanan hidup.";
}else{
hook = `Pernah ngerasa ${tema} kurang maksimal?`;
}

let hasil = `🎬 ${judul}\n\n`;
hasil += `Mode: ${mode}\nTema: ${tema}\nStyle: ${style}\n\n`;
hasil += `HOOK:\n${hook}\n\n`;

for(let i=1;i<=sceneCount;i++){

hasil += `SCENE ${i}\n`;
hasil += `Mood: ${emosi}\n`;
hasil += `Visual: ${visualBase}, cinematic lighting, depth of field\n`;
hasil += `T2I: ${visualBase}, ultra detailed, cinematic, 4k\n`;
hasil += `I2V: cinematic motion, camera movement, smooth transition\n`;
hasil += `VO: narration (${emosi})\n\n`;
}

// ================= AI FILM AUTO PIPELINE =================
hasil += `====================\nAI TOOLS OUTPUT\n====================\n\n`;

if(mode === "film"){
hasil += "AUTO FULL PIPELINE MODE:\n";
hasil += "- T2I: generate semua scene visual\n";
hasil += "- I2V: animasi video tiap scene\n";
hasil += "- Voice: narasi lengkap\n";
hasil += "- Lip Sync: jika ada dialog\n\n";
}else{

if(aitools === "t2i"){
hasil += `T2I Prompt:\n${visualBase}, ultra detailed\n\n`;
}
if(aitools === "i2v"){
hasil += `I2V Prompt:\ncinematic motion, dolly zoom, smooth movement\n\n`;
}
if(aitools === "voice"){
hasil += `Voice Over:\nemotional narration\n\n`;
}
if(aitools === "lip"){
hasil += `Lip Sync:\nsync mouth movement with audio\n\n`;
}
if(aitools === "prompt"){
hasil += `Advanced Prompt:\nsubject, cinematic lighting, depth of field, 35mm film look\n\n`;
}

}

document.getElementById("output").innerText = hasil;

}

</script></body>
</html>
