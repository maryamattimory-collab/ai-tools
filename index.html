<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>
body{
font-family:Arial;
background:#0b3d91;
color:white;
padding:20px;
}

h1{
margin-bottom:30px;
}

.card{
background:#1e5bb8;
padding:20px;
border-radius:10px;
margin-bottom:25px;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
border:none;
}

textarea{
min-height:80px;
}

button{
margin-top:10px;
padding:10px;
background:#4cc2ff;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.result{
background:#06245a;
padding:15px;
margin-top:10px;
border-radius:8px;
white-space:pre-wrap;
}
</style>
</head>

<body>

<h1>AI Studio Pro</h1>

<!-- ============================= -->
<!-- MERGE PHOTO -->
<!-- ============================= -->

<div class="card">

<h2>Gabungkan Foto</h2>

<input type="file" id="merge1" accept="image/*">
<input type="file" id="merge2" accept="image/*">
<input type="file" id="merge3" accept="image/*">
<input type="file" id="merge4" accept="image/*">

<textarea id="mergePrompt" placeholder="Instruksi tambahan"></textarea>

<button onclick="mergePhotos()">Gabungkan</button>

<div id="mergeResult" class="result"></div>

</div>


<!-- ============================= -->
<!-- ANALISA VIDEO -->
<!-- ============================= -->

<div class="card">

<h2>Analisa Video</h2>

<input type="file" id="videoFile" accept="video/*">

<select id="videoLanguage">
<option value="Bahasa Indonesia">Bahasa Indonesia</option>
<option value="English">English</option>
</select>

<select id="videoStyle">
<option value="Cinematic">Cinematic</option>
<option value="Realistic">Realistic</option>
<option value="3D Animation">3D Animation</option>
</select>

<textarea id="videoPrompt" placeholder="Instruksi analisa video"></textarea>

<button onclick="analyzeVideo()">Analisa</button>

<div id="videoResult" class="result"></div>

</div>


<!-- ============================= -->
<!-- INFOGRAFIS -->
<!-- ============================= -->

<div class="card">

<h2>Generator Infografis</h2>

<input id="topic" placeholder="Topik">

<select id="platform">
<option value="Instagram">Instagram</option>
<option value="TikTok">TikTok</option>
<option value="Poster">Poster</option>
</select>

<select id="styleInfographic">
<option value="Modern">Modern</option>
<option value="Minimalis">Minimalis</option>
<option value="Professional">Professional</option>
</select>

<textarea id="extraPrompt" placeholder="Instruksi tambahan"></textarea>

<button onclick="generateInfographic()">Generate</button>

<div id="infographicResult" class="result"></div>

</div>



<script>

async function fileToBase64(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader()

reader.onload=()=>{
resolve(reader.result.split(",")[1])
}

reader.onerror=reject

reader.readAsDataURL(file)

})

}



async function mergePhotos(){

const result=document.getElementById("mergeResult")

result.innerText="Loading..."

try{

const files=[
document.getElementById("merge1").files[0],
document.getElementById("merge2").files[0],
document.getElementById("merge3").files[0],
document.getElementById("merge4").files[0]
].filter(Boolean)

if(files.length<2){
result.innerText="Upload minimal 2 foto"
return
}

const images=[]

for(const file of files){

const data=await fileToBase64(file)

images.push({
mimeType:file.type,
data:data
})

}

const prompt=document.getElementById("mergePrompt").value

const res=await fetch("/api/merge-photos",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
images:images,
userPrompt:prompt
})
})

const data=await res.json()

result.innerText=data.text || data.error

}catch(err){

result.innerText="Error: "+err.message

}

}



async function analyzeVideo(){

const result=document.getElementById("videoResult")

result.innerText="Loading..."

try{

const file=document.getElementById("videoFile").files[0]

if(!file){
result.innerText="Upload video dulu"
return
}

const videoBase64=await fileToBase64(file)

const mimeType=file.type

const prompt=document.getElementById("videoPrompt").value
const language=document.getElementById("videoLanguage").value
const style=document.getElementById("videoStyle").value

const res=await fetch("https://thriving-harmony-production-76ec.up.railway.app/api/xxx")
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
videoBase64,
mimeType,
prompt,
language,
style
})
})

const data=await res.json()

result.innerText=data.text || data.error

}catch(err){

result.innerText="Error: "+err.message

}

}



async function generateInfographic(){

const topic=document.getElementById("topic").value
const platform=document.getElementById("platform").value
const style=document.getElementById("styleInfographic").value
const extraPrompt=document.getElementById("extraPrompt").value

const result=document.getElementById("infographicResult")

result.innerText="Generating..."

try{

const res=await fetch("/api/generate-infographic",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
topic,
platform,
style,
extraPrompt
})
})

const data=await res.json()

result.innerText=data.text || data.error

}catch(err){

result.innerText="Error: "+err.message

}

}

</script>

</body>
</html>
