<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}
.container{max-width:750px;padding:40px;text-align:center;}
.card{background:#1e293b;padding:25px;border-radius:16px;margin-bottom:20px;}
input,select{width:100%;padding:10px;margin-bottom:10px;border-radius:8px;border:none;}
button{background:#38bdf8;padding:12px;border:none;border-radius:10px;color:white;margin:5px;cursor:pointer;}
.copy-btn{background:#22c55e;}
.output{background:#020617;padding:15px;border-radius:10px;margin-top:15px;white-space:pre-line;text-align:left;}
</style>
</head>

<body>

<div class="container">

<h1>🎬 AI Studio Pro</h1>

<div class="card">

<div id="creditInfo">Credit: 10</div>

<select id="template">
<option value="">Pilih Ide</option>
<option value="clay">Clay Viral</option>
</select>

<input id="judul" placeholder="Judul">
<input id="tema" placeholder="Tema">

<select id="scene">
<option>3</option>
<option>5</option>
<option selected>10</option>
</select>

<select id="karakter">
<option>Ibu & Anak</option>
<option>Ibu</option>
<option>Anak</option>
<option value="custom">Custom</option>
</select>
<input id="customKarakter" placeholder="Custom karakter" style="display:none;">

<select id="emosi">
<option>Sedih</option>
<option>Haru</option>
<option value="custom">Custom</option>
</select>
<input id="customEmosi" placeholder="Custom emosi" style="display:none;">

<select id="style">
<option>Realistic Cinematic</option>
<option>Anime</option>
<option value="custom">Custom</option>
</select>
<input id="customStyle" placeholder="Custom style" style="display:none;">

<button onclick="generate()">Generate</button>
<button onclick="copyText()" class="copy-btn">Copy</button>

<div id="output" class="output"></div>

</div>

<!-- TOOLS -->
<div class="card">
<h4>Tools AI</h4>
<div>Infografis • Carousel • Leonardo • Veo • Analyze</div>
<a href="/chat.html"><button>Masuk Tools</button></a>
</div>

</div>

<script>

// CREDIT
let credit = localStorage.getItem("ai_credit") || 10;

function updateCredit(){
document.getElementById("creditInfo").innerText="Credit: "+credit;
}

// CUSTOM
karakter.onchange=()=>customKarakter.style.display=karakter.value==="custom"?"block":"none";
emosi.onchange=()=>customEmosi.style.display=emosi.value==="custom"?"block":"none";
style.onchange=()=>customStyle.style.display=style.value==="custom"?"block":"none";

// GENERATE
function generate(){

if(credit<=0){
alert("Credit habis!");
return;
}

let judul=document.getElementById("judul").value;
let tema=document.getElementById("tema").value;
let karakterVal=document.getElementById("karakter").value;
let emosiVal=document.getElementById("emosi").value;
let styleVal=document.getElementById("style").value;
let sceneVal=document.getElementById("scene").value;
let templateVal=document.getElementById("template").value;

// custom
let karakter=karakterVal==="custom"?customKarakter.value:karakterVal;
let emosi=emosiVal==="custom"?customEmosi.value:emosiVal;
let style=styleVal==="custom"?customStyle.value:styleVal;

// clay
if(templateVal==="clay"){
style+=", clay animation, soft texture";
}

let hasil="🔥 FULL SCRIPT SIAP PRODUKSI\n\n";

// MASTER
hasil+=`👤 MASTER KARAKTER:\n${karakter}, konsisten wajah\n\n`;
hasil+=`🚫 NEGATIVE:\nblur, low quality, bad anatomy, watermark\n\n`;
hasil+=`🎯 MASTER PROMPT:\n${tema}, ${style}, cinematic lighting, ultra detailed, 35mm, depth of field\n\n`;

let struktur=["HOOK","KONFLIK","EMOSI","FLASHBACK","PENYESALAN","ENDING"];

for(let i=1;i<=sceneVal;i++){

let t2i=`${karakter}, ${tema}, ${style}, cinematic, ultra detailed`;

let i2v=i%2===0?"slow zoom":"auto zoom dialog";

let vo=i===1
? `"${judul}... semuanya berubah"`
: i==sceneVal
? `"Aku menyesal..."`
: `narasi ${emosi}`;

hasil+=`🎬 SCENE ${i}\n`;
hasil+=`T2I:\n${t2i}\n`;
hasil+=`I2V:\n${i2v}\n`;
hasil+=`VO:\n${vo}\n\n`;
}

// tampil
output.innerText=hasil;

// credit
credit--;
localStorage.setItem("ai_credit",credit);
updateCredit();

}

// COPY
function copyText(){
navigator.clipboard.writeText(output.innerText);
alert("Copied");
}

updateCredit();

</script>

</body>
</html>
