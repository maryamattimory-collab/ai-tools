<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
text-align:center;
max-width:700px;
padding:40px;
}

h1{
font-size:42px;
margin-bottom:10px;
}

.sub{
color:#94a3b8;
margin-bottom:25px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}

.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}

.feature{
background:#020617;
padding:10px;
border-radius:8px;
font-size:13px;
color:#94a3b8;
}

input, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
outline:none;
}

button{
background:#38bdf8;
border:none;
padding:14px 20px;
font-size:15px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
margin:5px;
}

button:hover{
background:#0ea5e9;
}

.output{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;
white-space:pre-line;
font-size:14px;
}

.footer{
margin-top:15px;
color:#64748b;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 AI Content & Ads Generator</h1>

<div class="sub">
Buat film & iklan otomatis siap produksi
</div>

<div class="card">

<h3>🔥 Pilih Cepat:</h3>

<button onclick="preset('Anak Durhaka','Sedih')">Anak Durhaka</button>
<button onclick="preset('Ibu Sabar','Haru')">Ibu Sabar</button>
<button onclick="preset('Anak Menyesal','Sedih')">Anak Menyesal</button>
<button onclick="preset('Cerita Islami','Religius')">Islami</button>
<button onclick="preset('Cerita Horor','Tegang')">Horor</button>

<br><br>

<input type="text" id="judul" placeholder="Judul Cerita">
<input type="text" id="tema" placeholder="Tema">
<input type="text" id="produk" placeholder="Nama Produk">

<select id="scene">
<option value="3">3 Scene</option>
<option value="5">5 Scene</option>
<option value="7">7 Scene</option>
<option value="10">10 Scene</option>
</select>

<select id="emosi">
<option>Sedih</option>
<option>Haru</option>
<option>Bahagia</option>
<option>Religius</option>
<option>Tegang</option>
</select>

<select id="karakter">
<option>Ibu & Anak</option>
<option>Anak</option>
<option>Remaja</option>
<option>Hewan</option>
</select>

<select id="style">
<option>3D Pixar</option>
<option>Anime</option>
<option>Realistis Cinematic</option>
<option>Kartun Anak</option>
<option>Studio Ghibli</option>
</select>

<select id="target">
<option>Ibu Rumah Tangga</option>
<option>Remaja</option>
<option>Anak Muda</option>
<option>Umum</option>
</select>

<select id="gender">
<option>Perempuan</option>
<option>Laki-laki</option>
</select>

<button onclick="generateFilm()">🎬 Buat Film</button>
<button onclick="generateAds()">💰 Buat Iklan</button>

<div id="output" class="output"></div>

</div>

<div class="footer">
AI Studio Pro • Powered by Gemini
</div>

</div>

<script>

function preset(judul, emosi){
document.getElementById('judul').value = judul;
document.getElementById('tema').value = judul;
document.getElementById('emosi').value = emosi;
}

function generateFilm(){
const judul = document.getElementById('judul').value || "Tanpa Judul";
const tema = document.getElementById('tema').value || "Tema Umum";
const totalScene = parseInt(document.getElementById('scene').value);
const emosi = document.getElementById('emosi').value;
const karakter = document.getElementById('karakter').value;
const style = document.getElementById('style').value;

let hasil = `🎬 ${judul}\n\n`;

for(let i=1;i<=totalScene;i++){
hasil += `SCENE ${i}\n`;
hasil += `Visual: ${karakter}, ${tema}, ${style}\n`;
hasil += `T2I: ${karakter}, ${tema}, ${style}, cinematic\n`;
hasil += `I2V: cinematic video, ${emosi}\n`;
hasil += `VO: Narasi ${emosi}\n\n`;
}

document.getElementById("output").innerText = hasil;
}

function generateAds(){

const produk = document.getElementById('produk').value || "Produk";
const target = document.getElementById('target').value;
const gender = document.getElementById('gender').value;
const style = document.getElementById('style').value;
const emosi = document.getElementById('emosi').value;

let hasil = `💰 IKLAN SIAP PRODUKSI\n\n`;

for(let i=1;i<=5;i++){

let sceneText = ["Hook kuat","Masalah","Solusi","Hasil","CTA"][i-1];

hasil += `SCENE ${i} (${sceneText})\n`;
hasil += `Visual: ${gender}, ${target}, ${produk}, ${style}\n`;
hasil += `T2I: ${gender}, ${produk}, ${style}, highly detailed, cinematic\n`;
hasil += `I2V: cinematic video, ${emosi}, smooth motion\n`;
hasil += `VO: Narasi ${emosi} tentang ${produk}\n`;
hasil += `------------------------\n\n`;

}

document.getElementById("output").innerText = hasil;

}

</script>

</body>
</html>
