<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generator Script Iklan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
    }

    input, select, button, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-top: 5px;
      font-size: 14px;
    }

    input, select, textarea {
      background: #334155;
      color: #e2e8f0;
    }

    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }

    button:hover {
      background: #2563eb;
    }

    textarea {
      height: 260px;
      margin-top: 15px;
      resize: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Generator Script AI</h2>

    <label>Produk</label>
    <input type="text" id="produk" placeholder="Contoh: Mie Instan" />

    <label>Target</label>
    <input type="text" id="target" placeholder="Contoh: Anak Muda" />

    <label>Karakter</label>
    <input type="text" id="karakter" placeholder="Contoh: wanita berhijab" />

    <label>Mode</label>
    <select id="mode">
      <option value="film">🎬 AI Film</option>
      <option value="iklan">💰 AI Iklan</option>
      <option value="edukasi">🧠 AI Edukasi</option>
    </select>

    <label>Gender Model</label>
    <select id="gender">
      <option value="Perempuan">Perempuan</option>
      <option value="Laki-laki">Laki-laki</option>
    </select>

    <label>Emosi</label>
    <select id="emosi">
      <option value="confused">Confused</option>
      <option value="happy">Happy</option>
      <option value="sad">Sad</option>
    </select>

    <label>Style Visual</label>
    <select id="style">
      <option value="3D Pixar">3D Pixar</option>
      <option value="cinematic">Cinematic</option>
      <option value="realistic film">Realistic Film</option>
      <option value="skeleton">Skeleton Style</option>
      <option value="food character">🍎 Food Character</option>
    </select>

    <button onclick="generateAds()">Generate</button>

    <textarea id="output" placeholder="Hasil akan muncul di sini..."></textarea>
  </div>

  <script>
function generateAds(){

const produk = document.getElementById('produk').value || "Produk";
const target = document.getElementById('target').value || "Target";
const karakter = document.getElementById('karakter').value || "character";
const mode = document.getElementById('mode').value;
const gender = document.getElementById('gender').value;
const emosi = document.getElementById('emosi').value;
const style = document.getElementById('style').value;

// =========================
// VISUAL PROMPT DYNAMIC
// =========================
let visualBase = "";

if(style === "realistic film"){
  visualBase = `${gender}, ${karakter}, realistic, cinematic lighting, dramatic scene, depth of field, 35mm film look`;
} 
else if(style === "3D Pixar"){
  visualBase = `${gender}, ${karakter}, 3D Pixar style, vibrant colors, soft lighting`;
} 
else if(style === "skeleton"){
  visualBase = `${gender}, skeleton character, dark horror theme, eerie lighting, spooky atmosphere`;
} 
else if(style === "food character"){
  visualBase = `${karakter} transformed into anthropomorphic food character, vegetables/fruits style, cute expressive face, colorful cartoon, stylized design`;
} 
else {
  visualBase = `${gender}, ${karakter}, cinematic style, cinematic lighting`;
}

// =========================
// SCRIPT
// =========================
let hasil = `💰 SCRIPT (${mode.toUpperCase()})\n\n`;

hasil += `Produk: ${produk}\n`;
hasil += `Target: ${target}\n`;
hasil += `Model: ${gender}\n\n`;

// Hook per mode
if(mode === "edukasi"){
  hasil += `Hook:\n“Pernah bingung belajar AI? Sekarang lebih mudah!”\n\n`;
}else if(mode === "film"){
  hasil += `Hook:\n“Ini bukan sekedar cerita... ini perjalanan nyata.”\n\n`;
}else{
  hasil += `Hook:\n“Ibu Rumah Tangga, pernah ngerasa ${produk} gak maksimal?”\n\n`;
}

hasil += `Masalah:\nBanyak ${target.toLowerCase()} masih bingung\n\n`;
hasil += `Solusi:\nSekarang lebih mudah pakai AI\n\n`;
hasil += `CTA:\nMau juga? coba sekarang\n\n`;

hasil += `========================\n`;
hasil += `🎬 STORYBOARD IKLAN\n`;
hasil += `========================\n\n`;

// =========================
// SCENES
// =========================
let scenes = [
{judul:"HOOK", vo:`Pernah ngerasa ${produk} gak maksimal?`},
{judul:"MASALAH", vo:`Banyak ${target.toLowerCase()} masih bingung`},
{judul:"SOLUSI", vo:`Sekarang ada cara lebih mudah`},
{judul:"HASIL", vo:`Sekarang jadi lebih mudah dan praktis`},
{judul:"CTA", vo:`Mau juga? coba sekarang`}
];
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
text-align:center;
max-width:700px;
padding:40px;
}

h1{font-size:42px;margin-bottom:10px;}
.sub{color:#94a3b8;margin-bottom:25px;}

.card{
background:#1e293b;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}

.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}

.feature{
background:#020617;
padding:10px;
border-radius:8px;
font-size:13px;
color:#94a3b8;
}

input, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
outline:none;
}

button{
background:#38bdf8;
border:none;
padding:14px 20px;
font-size:15px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
margin:5px;
}

button:hover{background:#0ea5e9;}

.output{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;
white-space:pre-line;
font-size:14px;
}

.footer{
margin-top:15px;
color:#64748b;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 AI Studio Pro</h1>

<div class="sub">
Generate film, iklan, edukasi + AI tools lengkap tanpa kehilangan fitur lama
</div>

<div class="card">

<h3>🔥 Quick Preset:</h3>
<button onclick="preset('Anak Durhaka','Sedih')">Anak Durhaka</button>
<button onclick="preset('Ibu Sabar','Haru')">Ibu Sabar</button>
<button onclick="preset('Anak Menyesal','Sedih')">Anak Menyesal</button>
<button onclick="preset('Cerita Islami','Religius')">Islami</button>
<button onclick="preset('Cerita Horor','Tegang')">Horor</button>

<br><br>

<input type="text" id="judul" placeholder="Judul Cerita">
<input type="text" id="tema" placeholder="Tema">

<!-- MODE BARU -->
<select id="mode">
<option value="film" selected>🎬 AI Film</option>
<option value="iklan">💰 AI Iklan</option>
<option value="edukasi">🧠 AI Edukasi</option>
</select>

<select id="scene">
<option value="3" selected>3 Scene</option>
<option value="5">5 Scene</option>
<option value="7">7 Scene</option>
</select>

<select id="emosi">
<option>Sedih</option>
<option>Haru</option>
<option>Bahagia</option>
<option>Religius</option>
<option>Tegang</option>
</select>

<select id="karakter">
<option>Ibu & Anak</option>
<option>Anak</option>
<option>Remaja</option>
<option>Hewan</option>
</select>

<select id="style">
<option selected>3D Pixar</option>
<option>Anime</option>
<option>Realistis Cinematic</option>
<option>Kartun Anak</option>
<option>Studio Ghibli</option>
<option>Skeleton</option>
<option>Food Character</option>
</select>

<!-- AI TOOLS TETAP ADA -->
<select id="aitools">
<option value="none" selected>AI Tools: None</option>
<option value="t2i">Text to Image</option>
<option value="i2v">Image to Video</option>
<option value="voice">Voice Over</option>
<option value="lip">AI Lip Sync</option>
<option value="prompt">Prompt Generator</option>
</select>

<button onclick="generate()">🎬 Generate</button>

<div id="output" class="output"></div>

</div>

<div class="card">
<h4>Tools Lainnya (TIDAK DIHAPUS)</h4>
<div class="features">
<div class="feature">Infografis Generator</div>
<div class="feature">TikTok Carousel</div>
<div class="feature">Leonardo Prompt</div>
<div class="feature">Veo Video Prompt</div>
<div class="feature">Analyze Video</div>
<div class="feature">Gabungkan Foto</div>
</div>

<a href="/chat.html">
<button>Masuk ke AI Tools</button>
</a>
</div>

<div class="footer">
AI Studio Pro • All Features Integrated
</div>

</div>

<script>

function preset(judul, emosi){
document.getElementById('judul').value = judul;
document.getElementById('tema').value = judul;
document.getElementById('emosi').value = emosi;
}

function generate(){

const judul = document.getElementById('judul').value;
const tema = document.getElementById('tema').value;
const sceneCount = parseInt(document.getElementById('scene').value);
const emosi = document.getElementById('emosi').value;
const karakter = document.getElementById('karakter').value;
const style = document.getElementById('style').value;
const mode = document.getElementById('mode').value;
const aitools = document.getElementById('aitools').value;

// ================= VISUAL =================
let visualBase = "";

if(style === "Realistis Cinematic"){
visualBase = `${karakter}, realistic, cinematic lighting, 35mm film look`;
}
else if(style === "Skeleton"){
visualBase = `${karakter}, skeleton character, dark horror cinematic lighting`;
}
else if(style === "Food Character"){
visualBase = `${karakter} as anthropomorphic food character, cute expressive, colorful`;
}
else{
visualBase = `${karakter}, ${style}, cinematic scene`;
}

// ================= MODE HOOK =================
let hook = "";

if(mode === "edukasi"){
hook = "Belajar AI sekarang lebih mudah dan cepat...";
}
else if(mode === "film"){
hook = "Ini bukan sekadar cerita... ini perjalanan hidup.";
}
else{
hook = `Pernah ngerasa ${tema} kurang maksimal?`;
}

// ================= OUTPUT =================
let hasil = `🎬 ${judul}\n\n`;
hasil += `Mode: ${mode}\n`;
hasil += `Tema: ${tema}\n`;
hasil += `Style: ${style}\n\n`;

hasil += `HOOK:\n${hook}\n\n`;

// ================= SCENE =================
for(let i=1;i<=sceneCount;i++){

hasil += `SCENE ${i}\n`;
hasil += `Mood: ${emosi}\n`;
hasil += `Visual: ${visualBase}, cinematic lighting, depth of field\n`;
hasil += `T2I: ${visualBase}, ultra detailed, cinematic, 4k\n`;
hasil += `I2V: cinematic motion, smooth camera movement\n`;
hasil += `VO: narasi emosional (${emosi})\n\n`;
}

// ================= AI TOOLS OUTPUT =================
hasil += `====================\n🧠 AI TOOLS OUTPUT\n====================\n\n`;

if(aitools === "t2i"){
hasil += `T2I Prompt:\n${visualBase}, ultra detailed, cinematic, 4k\n\n`;
}
else if(aitools === "i2v"){
hasil += `I2V Prompt:\ncinematic motion, dolly zoom, smooth camera movement\n\n`;
}
else if(aitools === "voice"){
hasil += `Voice Over:\nemotional narration, cinematic storytelling voice\n\n`;
}
else if(aitools === "lip"){
hasil += `Lip Sync:\nsync mouth movement with audio, natural speaking animation\n\n`;
}
else if(aitools === "prompt"){
hasil += `Advanced Prompt:\nsubject, cinematic lighting, depth of field, 35mm film look, ultra realistic\n\n`;
}

document.getElementById("output").innerText = hasil;

}

</script>

</body>
</html>
