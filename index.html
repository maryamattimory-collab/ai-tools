<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
text-align:center;
max-width:700px;
padding:40px;
}

h1{
font-size:48px;
margin-bottom:10px;
}

.sub{
color:#94a3b8;
margin-bottom:30px;
}

.card{
background:#1e293b;
padding:30px;
border-radius:16px;
margin-bottom:25px;
}

.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:30px;
}

.feature{
background:#020617;
padding:12px;
border-radius:8px;
font-size:14px;
}

input, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
}

button{
background:#38bdf8;
border:none;
padding:14px 28px;
font-size:16px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
margin:5px;
}

button:hover{
background:#0ea5e9;
}

.output{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;
white-space:pre-line;
font-size:14px;
}

.footer{
margin-top:20px;
color:#64748b;
font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<h1>🎬 AI Cerita Otomatis</h1>

<div class="sub">
Buat cerita film emosional dalam 1 klik (siap untuk TikTok & Reels)
</div>

<!-- 🔥 TOOLS BARU (DITAMBAHKAN) -->

<div class="card">

<h3>🔥 Pilih Cepat:</h3>

<button onclick="isiPreset('Anak Durhaka')">Anak Durhaka</button> <button onclick="isiPreset('Ibu Sabar')">Ibu Sabar</button> <button onclick="isiPreset('Anak Menyesal')">Anak Menyesal</button>

<br><br>

<input type="text" id="judul" placeholder="Judul Cerita">
<input type="text" id="tema" placeholder="Tema (contoh: anak durhaka)">

<select id="scene">
<option>3 Scene</option>
<option>5 Scene</option>
<option>7 Scene</option>
</select>

<select id="emosi">
<option>Sedih</option>
<option>Haru</option>
<option>Bahagia</option>
<option>Religius</option>
</select>

<select id="karakter">
<option>Ibu & Anak</option>
<option>Anak</option>
<option>Hewan</option>
</select>

<button onclick="generate()">🎬 Buat Cerita Sekarang</button>

<div id="output" class="output"></div>

</div>

<!-- 🔽 BAGIAN LAMA (TIDAK DIHAPUS) -->

<div class="card">

<div class="features">

<div class="feature">Infografis Generator</div>
<div class="feature">TikTok Carousel</div>
<div class="feature">Leonardo Prompt</div>
<div class="feature">Veo Video Prompt</div>
<div class="feature">Analyze Video</div>
<div class="feature">Gabungkan Foto</div>

</div>

<a href="/chat.html">
<button>Masuk ke AI Tools</button>
</a>

</div>

<div class="footer">
AI Studio Pro • Powered by Gemini
</div>

</div>

<script>

function isiPreset(tipe){
document.getElementById('judul').value = tipe;
document.getElementById('tema').value = tipe;
}

function generate(){
const judul = document.getElementById('judul').value;
const tema = document.getElementById('tema').value;
const scene = document.getElementById('scene').value;
const emosi = document.getElementById('emosi').value;
const karakter = document.getElementById('karakter').value;

const hasil = `
🎬 ${judul}

SCENE 1
Visual: ${karakter} dalam situasi ${tema}
Voice Over: Awal cerita penuh ${emosi}

SCENE 2
Visual: Konflik mulai muncul
Voice Over: Emosi semakin ${emosi}

SCENE 3
Visual: Puncak cerita
Voice Over: Momen paling menyentuh
`;

document.getElementById("output").innerText = hasil;
}

</script>

</body>
</html>
