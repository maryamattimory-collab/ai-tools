<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title><style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
text-align:center;
max-width:750px;
padding:40px;
}

h1{font-size:42px;margin-bottom:10px;}
.sub{color:#94a3b8;margin-bottom:25px;}

.card{
background:#1e293b;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}

.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}

.feature{
background:#020617;
padding:10px;
border-radius:8px;
font-size:13px;
color:#94a3b8;
}

input, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
outline:none;
}

button{
background:#38bdf8;
border:none;
padding:14px 20px;
font-size:15px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
margin:5px;
}

button:hover{background:#0ea5e9;}

.copy-btn{background:#22c55e;}

.output{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;
white-space:pre-line;
font-size:14px;
}

.footer{
margin-top:15px;
color:#64748b;
font-size:12px;
}

.extra{display:none;}
</style></head><body><div class="container"><h1>🎬 AI Studio Pro</h1>
<div class="sub">Generator Film, Iklan, Edukasi AI</div><div class="card"><div id="creditInfo" style="margin-bottom:10px;color:#38bdf8;font-weight:bold;">
Credit: 10
</div><select id="template">
<option value="">🎯 Pilih Ide (Opsional)</option>
<option value="ibu">Ibu & Anak Menyesal</option>
<option value="horor">Horor Seram</option>
<option value="iklan">Iklan Produk Lucu</option>
<option value="edukasi">Edukasi Buah / Object Talk</option>
</select><select id="mode">
<option value="film">🎬 AI Film</option>
<option value="iklan">💰 AI Iklan</option>
<option value="edukasi">🧠 AI Edukasi</option>
<option value="edukasi_pro">📚 Edukasi Pro</option>
</select><input type="text" id="judul" placeholder="Judul">
<input type="text" id="tema" placeholder="Tema"><input type="text" id="produk" placeholder="Produk (khusus iklan)" style="display:none;"><div id="edukasiProBox" class="extra">
<select id="outputType">
<option value="storybook">Storybook</option>
<option value="lkpd">LKPD</option>
<option value="komik">Komik</option>
<option value="workbook">Workbook</option>
<option value="script">Script Video</option>
</select><input type="text" id="usia" placeholder="Usia anak (contoh: 7-10 tahun)">
<input type="text" id="tujuan" placeholder="Tujuan pembelajaran">
</div><select id="scene">
<option value="3">3 Scene</option>
<option value="5">5 Scene</option>
<option value="7">7 Scene</option>
<option value="10" selected>10 Scene</option>
</select><select id="emosi">
<option>Sedih</option>
<option>Haru</option>
<option>Bahagia</option>
<option>Religius</option>
<option>Tegang</option>
<option selected>Ketakutan</option>
<option>Ceria</option>
<option>Seru</option>
<option>Pertualangan</option>
</select><select id="karakter">
<option selected>Ibu & Anak</option>
<option>Anak</option>
<option>Remaja</option>
<option>Hewan</option>
<option>Buah</option>
<option>Sayur</option>
</select><select id="style">
<option selected>Realistic Cinematic</option>
<option>3D Pixar</option>
<option>Anime</option>
<option>Kartun Anak</option>
<option>Studio Ghibli</option>
<option>Skeleton Cute</option>
</select><button onclick="generate()">🎬 Generate</button> <button class="copy-btn" onclick="copyText()">📋 Copy</button>

<div style="font-size:13px;color:#94a3b8;margin-top:10px;">
📌 Cara pakai:<br>
1. Pilih template<br>
2. Klik generate<br>
3. Copy hasil<br>
4. Masukkan ke AI / editor
</div><div id="output" class="output"></div></div><div class="card">
<h4>Tools AI</h4>
<div class="features">
<div class="feature">Infografis Generator</div>
<div class="feature">TikTok Carousel</div>
<div class="feature">Leonardo Prompt</div>
<div class="feature">Veo Video Prompt</div>
<div class="feature">Analyze Video</div>
</div>
<a href="/chat.html"><button>Masuk ke AI Tools</button></a>
</div><div class="footer">AI Studio Pro</div></div><script>

let credit = localStorage.getItem("ai_credit");
if(credit === null){
credit = 10;
localStorage.setItem("ai_credit", credit);
}else{
credit = parseInt(credit);
}

function updateCredit(){
document.getElementById("creditInfo").innerText = "Credit: " + credit;
}

template.onchange = function(){
if(this.value==="ibu"){
judul.value="Anak Menyesal";
tema.value="Anak durhaka kepada ibu lalu menyesal";
emosi.value="Sedih";
}
if(this.value==="horor"){
judul.value="Malam Terakhir";
tema.value="Rumah angker penuh misteri";
emosi.value="Ketakutan";
}
if(this.value==="iklan"){
mode.value="iklan";
judul.value="Mie Ajaib";
tema.value="Mie instan misterius";
}
if(this.value==="edukasi"){
mode.value="edukasi";
judul.value="Buah Bisa Bicara";
tema.value="Buah mengajarkan anak";
}
};

mode.onchange = function(){
produk.style.display = this.value==="iklan"?"block":"none";
edukasiProBox.style.display = this.value==="edukasi_pro"?"block":"none";
};

function generate(){

if(credit<=0) return alert("Credit habis, balik lagi besok ya 😊");

let hasil="🔥 READY TO USE SCRIPT\n\n";
const modeVal = mode.value;

if(modeVal==="edukasi_pro"){

hasil += `📚 EDUKASI PRO\n\n`;

if(outputType.value==="storybook"){
hasil += `Buat cerita anak Islami\nTema: ${tema.value}\nUsia: ${usia.value}\n`;
}

if(outputType.value==="lkpd"){
hasil += `Buat LKPD\nTema: ${tema.value}\nTujuan: ${tujuan.value}\n`;
}

if(outputType.value==="komik"){
hasil += `Script komik 4 panel\nTema: ${tema.value}\n`;
}

if(outputType.value==="workbook"){
hasil += `Workbook latihan\nTema: ${tema.value}\n`;
}

if(outputType.value==="script"){
hasil += `Script video edukasi\nTema: ${tema.value}\n`;
}

}else{

hasil += `🎬 ${judul.value}\nMode: ${modeVal}\nTema: ${tema.value}\n`;

if(modeVal==="iklan"){
hasil += `Produk: ${produk.value}\n\n`;
}

for(let i=1;i<=scene.value;i++){

let base = `${karakter.value}, ${tema.value}`;

if(modeVal==="edukasi") base = `${karakter.value} object talk`;
if(modeVal==="iklan") base = `${produk.value} fokus utama`;

hasil += `SCENE ${i}\n`;
hasil += `Visual: ${base}, ${style.value}, mood ${emosi.value}\n`;
hasil += `T2I: cinematic\n`;
hasil += `I2V: motion\n`;
hasil += `VO: narasi ${emosi.value}\n\n`;

}

}

output.innerText = hasil;

credit--;
localStorage.setItem("ai_credit", credit);
updateCredit();

}

function copyText(){
navigator.clipboard.writeText(output.innerText);
alert("Berhasil di copy!");
}

updateCredit();

</script></body>
</html>
