<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generator Script Iklan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
    }

    input, select, button, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-top: 5px;
      font-size: 14px;
    }

    input, select, textarea {
      background: #334155;
      color: #e2e8f0;
    }

    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }

    button:hover {
      background: #2563eb;
    }

    textarea {
      height: 260px;
      margin-top: 15px;
      resize: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Generator Script AI</h2>

    <label>Produk</label>
    <input type="text" id="produk" placeholder="Contoh: Mie Instan" />

    <label>Target</label>
    <input type="text" id="target" placeholder="Contoh: Anak Muda" />

    <label>Karakter</label>
    <input type="text" id="karakter" placeholder="Contoh: wanita berhijab" />

    <label>Mode</label>
    <select id="mode">
      <option value="film">🎬 AI Film</option>
      <option value="iklan">💰 AI Iklan</option>
      <option value="edukasi">🧠 AI Edukasi</option>
    </select>

    <label>Gender Model</label>
    <select id="gender">
      <option value="Perempuan">Perempuan</option>
      <option value="Laki-laki">Laki-laki</option>
    </select>

    <label>Emosi</label>
    <select id="emosi">
      <option value="confused">Confused</option>
      <option value="happy">Happy</option>
      <option value="sad">Sad</option>
    </select>

    <label>Style Visual</label>
    <select id="style">
      <option value="3D Pixar">3D Pixar</option>
      <option value="cinematic">Cinematic</option>
      <option value="realistic film">Realistic Film</option>
      <option value="skeleton">Skeleton Style</option>
      <option value="food character">🍎 Food Character</option>
    </select>

    <button onclick="generateAds()">Generate</button>

    <textarea id="output" placeholder="Hasil akan muncul di sini..."></textarea>
  </div>

  <script>
function generateAds(){

const produk = document.getElementById('produk').value || "Produk";
const target = document.getElementById('target').value || "Target";
const karakter = document.getElementById('karakter').value || "character";
const mode = document.getElementById('mode').value;
const gender = document.getElementById('gender').value;
const emosi = document.getElementById('emosi').value;
const style = document.getElementById('style').value;

// =========================
// VISUAL PROMPT DYNAMIC
// =========================
let visualBase = "";

if(style === "realistic film"){
  visualBase = `${gender}, ${karakter}, realistic, cinematic lighting, dramatic scene, depth of field, 35mm film look`;
} 
else if(style === "3D Pixar"){
  visualBase = `${gender}, ${karakter}, 3D Pixar style, vibrant colors, soft lighting`;
} 
else if(style === "skeleton"){
  visualBase = `${gender}, skeleton character, dark horror theme, eerie lighting, spooky atmosphere`;
} 
else if(style === "food character"){
  visualBase = `${karakter} transformed into anthropomorphic food character, vegetables/fruits style, cute expressive face, colorful cartoon, stylized design`;
} 
else {
  visualBase = `${gender}, ${karakter}, cinematic style, cinematic lighting`;
}

// =========================
// SCRIPT
// =========================
let hasil = `💰 SCRIPT (${mode.toUpperCase()})\n\n`;

hasil += `Produk: ${produk}\n`;
hasil += `Target: ${target}\n`;
hasil += `Model: ${gender}\n\n`;

// Hook per mode
if(mode === "edukasi"){
  hasil += `Hook:\n“Pernah bingung belajar AI? Sekarang lebih mudah!”\n\n`;
}else if(mode === "film"){
  hasil += `Hook:\n“Ini bukan sekedar cerita... ini perjalanan nyata.”\n\n`;
}else{
  hasil += `Hook:\n“Ibu Rumah Tangga, pernah ngerasa ${produk} gak maksimal?”\n\n`;
}

hasil += `Masalah:\nBanyak ${target.toLowerCase()} masih bingung\n\n`;
hasil += `Solusi:\nSekarang lebih mudah pakai AI\n\n`;
hasil += `CTA:\nMau juga? coba sekarang\n\n`;

hasil += `========================\n`;
hasil += `🎬 STORYBOARD IKLAN\n`;
hasil += `========================\n\n`;

// =========================
// SCENES
// =========================
let scenes = [
{judul:"HOOK", vo:`Pernah ngerasa ${produk} gak maksimal?`},
{judul:"MASALAH", vo:`Banyak ${target.toLowerCase()} masih bingung`},
{judul:"SOLUSI", vo:`Sekarang ada cara lebih mudah`},
{judul:"HASIL", vo:`Sekarang jadi lebih mudah dan praktis`},
{judul:"CTA", vo:`Mau juga? coba sekarang`}
];

scenes.forEach((s, i)=>{
hasil += `SCENE ${i+1} - ${s.judul}\n`;
hasil += `Mood: ${emosi}\n`;
hasil += `Lighting: cinematic\n`;
hasil += `Visual: ${visualBase}\n`;
hasil += `Background: cinematic environment\n`;
hasil += `T2I: ${visualBase}, ${style}, cinematic, detailed\n`;
hasil += `I2V: cinematic motion, smooth camera movement\n`;
hasil += `VO: ${s.vo}\n`;
hasil += `------------------------\n\n`;
});

// =========================
// CAPTION
// =========================
hasil += `📝 CAPTION:\n`;
hasil += `${produk} bikin hidup ${target.toLowerCase()} lebih mudah\n`;
hasil += `CTA: klik sekarang`;

document.getElementById("output").innerText = hasil;

}
  </script>
</body>
</html>
