<script>

function preset(judul, emosi){
document.getElementById('judul').value = judul;
document.getElementById('tema').value = judul;
document.getElementById('emosi').value = emosi;
}

function generate(){

const judul = document.getElementById('judul').value;
const tema = document.getElementById('tema').value;
let sceneText = document.getElementById('scene').value;
let totalScene = parseInt(sceneText);
const emosi = document.getElementById('emosi').value;
const karakter = document.getElementById('karakter').value;
const style = document.getElementById('style').value;

// 🔥 Struktur alur biar cinematic
let alur = [
"Perkenalan karakter",
"Kehidupan awal yang tenang",
"Muncul konflik kecil",
"Masalah mulai membesar",
"Ketegangan meningkat",
"Titik terendah karakter",
"Puncak konflik (klimaks)",
"Momen kesadaran",
"Mulai perubahan",
"Ending menyentuh"
];

let hasil = `🎬 ${judul}\n\nStyle Visual: ${style}\nTema: ${tema}\n\n`;

for(let i=1;i<=totalScene;i++){

let posisi = alur[i-1] || "Kelanjutan cerita";

hasil += `SCENE ${i}\n`;
hasil += `Deskripsi: ${posisi}\n`;
hasil += `Visual: ${karakter} dalam cerita ${tema}, gaya ${style}, cinematic lighting, emotional scene\n`;
hasil += `Prompt T2I: ${karakter}, ${tema}, ${style}, highly detailed, cinematic, dramatic lighting\n`;
hasil += `Prompt I2V: cinematic video, ${emosi}, smooth camera movement, emotional storytelling\n`;
hasil += `Voice Over: Narasi ${emosi} pada bagian ${posisi}\n\n`;

}

document.getElementById("output").innerText = hasil;

}

</script>
