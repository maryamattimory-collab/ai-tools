<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}
.container{
text-align:center;
max-width:750px;
padding:40px;
}
h1{font-size:42px;margin-bottom:10px;}
.sub{color:#94a3b8;margin-bottom:25px;}
.card{
background:#1e293b;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}
.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}
.feature{
background:#020617;
padding:10px;
border-radius:8px;
font-size:13px;
color:#94a3b8;
}
input, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
outline:none;
}
button{
background:#38bdf8;
border:none;
padding:14px 20px;
font-size:15px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
margin:5px;
}
button:hover{background:#0ea5e9;}
.copy-btn{background:#22c55e;}
.output{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;
white-space:pre-line;
font-size:14px;
}
.footer{
margin-top:15px;
color:#64748b;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 AI Studio Pro</h1>
<div class="sub">Generator Film, Iklan, Edukasi AI</div>

<div class="card">

<div id="creditInfo">Credit: 10</div>

<select id="template">
<option value="">Pilih Ide</option>
<option value="clay">Clay Viral</option>
</select>

<input id="judul" placeholder="Judul">
<input id="tema" placeholder="Tema">

<select id="scene">
<option>3</option>
<option>5</option>
<option selected>10</option>
</select>

<select id="emosi">
<option>Sedih</option>
<option value="custom">Custom</option>
</select>
<input id="customEmosi" placeholder="Custom emosi" style="display:none;">

<select id="karakter">
<option>Ibu & Anak</option>
<option value="custom">Custom</option>
</select>
<input id="customKarakter" placeholder="Custom karakter" style="display:none;">

<select id="style">
<option>Realistic Cinematic</option>
<option value="custom">Custom</option>
</select>
<input id="customStyle" placeholder="Custom style" style="display:none;">

<button onclick="generate()">Generate</button>
<button onclick="copyText()">Copy</button>

<div id="output" class="output"></div>

</div>

<script>

// CREDIT FIX
let credit = localStorage.getItem("ai_credit");
if(!credit){credit=10;}

function updateCredit(){
document.getElementById("creditInfo").innerText="Credit: "+credit;
}

// GENERATE FIX
function generate(){

if(credit<=0){
alert("Credit habis!");
return;
}

let judul = document.getElementById("judul").value;
let tema = document.getElementById("tema").value;
let karakter = document.getElementById("karakter").value;
let emosi = document.getElementById("emosi").value;
let style = document.getElementById("style").value;
let scene = document.getElementById("scene").value;

let hasil="🔥 SCRIPT SIAP PRODUKSI\n\n";

for(let i=1;i<=scene;i++){

let vo = i===1
? `"${judul}... semuanya berubah"`
: i==scene
? `"Aku menyesal..."`
: `narasi ${emosi}`;

hasil+=`SCENE ${i}\n`;
hasil+=`TEMA: ${tema}\n`;
hasil+=`VISUAL: ${karakter}, ${style}\n`;
hasil+=`VO: ${vo}\n\n`;

}

document.getElementById("output").innerText=hasil;

credit--;
localStorage.setItem("ai_credit",credit);
updateCredit();
}

function copyText(){
navigator.clipboard.writeText(document.getElementById("output").innerText);
alert("Copied");
}

updateCredit();

</script>

</body>
</html>
