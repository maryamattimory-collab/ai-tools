<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}
.container{
text-align:center;
max-width:750px;
padding:40px;
}
h1{font-size:42px;margin-bottom:10px;}
.sub{color:#94a3b8;margin-bottom:25px;}
.card{
background:#1e293b;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}
.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}
.feature{
background:#020617;
padding:10px;
border-radius:8px;
font-size:13px;
color:#94a3b8;
}
input, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
outline:none;
box-sizing:border-box;
}
button{
background:#38bdf8;
border:none;
padding:14px 20px;
font-size:15px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
margin:5px;
}
button:hover{background:#0ea5e9;}
.copy-btn{background:#22c55e;}
.copy-btn:hover{background:#16a34a;}
.output{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;
white-space:pre-line;
font-size:14px;
}
.footer{
margin-top:15px;
color:#64748b;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 AI Studio Pro</h1>
<div class="sub">Generator Film, Iklan, Edukasi AI</div>

<div class="card">

<div id="creditInfo" style="color:#38bdf8;font-weight:bold;">Credit: 10</div>
<div style="font-size:12px;color:#94a3b8;margin-bottom:10px;">
Free 10 credit / hari • Premium tanpa batas
</div>

<select id="template">
<option value="">🎯 Pilih Ide</option>
<option value="ibu">Ibu & Anak Menyesal</option>
<option value="horor">Horor Seram</option>
<option value="iklan">Iklan Produk</option>
<option value="edukasi">Edukasi</option>
<option value="clay">🔥 Clay Viral Story</option>
<option value="object">🗣️ Object Talk</option>
</select>

<select id="mode">
<option value="film">🎬 Film</option>
<option value="iklan">💰 Iklan</option>
<option value="edukasi">🧠 Edukasi</option>
<option value="edukasi_pro">📚 Edukasi Pro</option>
</select>

<input id="judul" placeholder="Judul">
<input id="tema" placeholder="Tema">

<input id="produk" placeholder="Nama Produk" style="display:none;">
<input type="file" id="produkImg" style="display:none;">

<div id="edukasiProBox" style="display:none;">
<select id="outputType">
<option value="storybook">📖 Storybook</option>
<option value="lkpd">📝 LKPD</option>
<option value="komik">💬 Komik</option>
<option value="workbook">📚 Workbook</option>
<option value="script">🎬 Script Video</option>
</select>

<input id="usia" placeholder="Usia anak">
<input id="tujuan" placeholder="Tujuan pembelajaran">
</div>

<select id="scene">
<option>3</option>
<option>5</option>
<option>7</option>
<option selected>10</option>
</select>

<select id="emosi">
<option>Sedih</option>
<option>Haru</option>
<option>Bahagia</option>
<option>Religius</option>
<option>Tegang</option>
<option>Ceria</option>
<option>Seru</option>
<option value="custom">Custom</option>
</select>
<input id="customEmosi" placeholder="Custom emosi" style="display:none;">

<select id="karakter">
<option>Ibu & Anak</option>
<option>Ibu</option>
<option>Anak</option>
<option>Remaja</option>
<option>Buah</option>
<option>Sayur</option>
<option>Benda</option>
<option value="custom">Custom</option>
<option value="none">Tanpa Karakter</option>
</select>
<input id="customKarakter" placeholder="Custom karakter" style="display:none;">

<select id="style">
<option>Realistic Cinematic</option>
<option>3D Pixar</option>
<option>Anime</option>
<option>Kartun Anak</option>
<option value="custom">Custom</option>
</select>
<input id="customStyle" placeholder="Custom style" style="display:none;">

<button onclick="generate()">🎬 Generate</button>
<button class="copy-btn" onclick="copyText()">📋 Copy</button>

<div id="output" class="output"></div>

</div>

<!-- TOOLS -->
<div class="card">
<h4>Tools AI</h4>

<div class="features">
<div class="feature">Infografis Generator</div>
<div class="feature">TikTok Carousel</div>
<div class="feature">Leonardo Prompt</div>
<div class="feature">Veo Video Prompt</div>
<div class="feature">Analyze Video</div>
<div class="feature">Gabungkan Foto</div>
</div>

<button style="background:#475569;cursor:not-allowed;">
🚧 AI Tools (Coming Soon)
</button>

<div style="font-size:12px;color:#94a3b8;margin-top:8px;">
Segera hadir: Infografis, Carousel, Prompt AI & lainnya
</div>

</div>

<div class="footer">AI Studio Pro</div>

</div>

<script>
let credit = parseInt(localStorage.getItem("ai_credit") || "10", 10);

function updateCredit(){
document.getElementById("creditInfo").innerText = "Credit: " + credit;
}

// TEMPLATE
template.onchange = function(){
if(this.value === "ibu"){
mode.value = "film";
judul.value = "Anak Menyesal";
tema.value = "Anak durhaka kepada ibu lalu menyesal";
emosi.value = "Sedih";
karakter.value = "Ibu & Anak";
}
else if(this.value === "horor"){
mode.value = "film";
judul.value = "Malam Terakhir";
tema.value = "Rumah angker penuh misteri";
emosi.value = "Tegang";
karakter.value = "Remaja";
}
else if(this.value === "iklan"){
mode.value = "iklan";
judul.value = "Iklan Produk Viral";
tema.value = "Produk unik yang menarik perhatian";
produk.value = "Produk Viral";
}
else if(this.value === "edukasi"){
mode.value = "edukasi";
judul.value = "Pelajaran dari Kehidupan";
tema.value = "Nilai hidup yang bisa dipelajari anak";
karakter.value = "Anak";
}
else if(this.value === "clay"){
mode.value = "film";
judul.value = "Clay Viral Story";
tema.value = "Cerita pendek emosional bergaya clay animation";
style.value = "3D Pixar";
}
else if(this.value === "object"){
mode.value = "edukasi";
judul.value = "Benda yang Bicara";
tema.value = "Sebuah benda memberi pelajaran hidup";
karakter.value = "Benda";
}
mode.onchange();
karakter.onchange();
emosi.onchange();
style.onchange();
};

// MODE
mode.onchange = function(){
produk.style.display = this.value === "iklan" ? "block" : "none";
produkImg.style.display = this.value === "iklan" ? "block" : "none";
edukasiProBox.style.display = this.value === "edukasi_pro" ? "block" : "none";
};

karakter.onchange = function(){
customKarakter.style.display = karakter.value === "custom" ? "block" : "none";
};

emosi.onchange = function(){
customEmosi.style.display = emosi.value === "custom" ? "block" : "none";
};

style.onchange = function(){
customStyle.style.display = style.value === "custom" ? "block" : "none";
};

function generate(){

if(credit <= 0){
alert("Credit habis!");
return;
}

let hasil = "🔥 SCRIPT FULL SIAP PRODUKSI\n\n";

let karakterFinal = karakter.value === "custom" ? customKarakter.value.trim() : karakter.value;
let emosiFinal = emosi.value === "custom" ? customEmosi.value.trim() : emosi.value;
let styleFinal = style.value === "custom" ? customStyle.value.trim() : style.value;

if(!karakterFinal) karakterFinal = "Karakter";
if(!emosiFinal) emosiFinal = "Emosional";
if(!styleFinal) styleFinal = "Realistic Cinematic";

const modeVal = mode.value;

if(modeVal === "edukasi_pro"){
hasil += `📚 EDUKASI PRO\n\n`;
hasil += `Judul: ${judul.value || "-"}\n`;
hasil += `Tema: ${tema.value || "-"}\n`;
hasil += `Jenis Output: ${outputType.value}\n`;
hasil += `Usia Anak: ${usia.value || "-"}\n`;
hasil += `Tujuan: ${tujuan.value || "-"}\n\n`;

if(outputType.value === "storybook"){
hasil += `📖 STORYBOOK\n\n`;
hasil += `Buat cerita anak dengan tema "${tema.value}" untuk usia ${usia.value || "anak-anak"}.\n`;
hasil += `Gunakan bahasa sederhana, emosional, dan mudah dipahami.\n`;
}
else if(outputType.value === "lkpd"){
hasil += `📝 LKPD\n\n`;
hasil += `Tema: ${tema.value}\n`;
hasil += `Tujuan pembelajaran: ${tujuan.value || "-"}\n`;
hasil += `Sertakan aktivitas, refleksi, dan pertanyaan sederhana.\n`;
}
else if(outputType.value === "komik"){
hasil += `💬 KOMIK\n\n`;
hasil += `Buat komik singkat bertema "${tema.value}" dengan dialog sederhana dan pesan moral jelas.\n`;
}
else if(outputType.value === "workbook"){
hasil += `📚 WORKBOOK\n\n`;
hasil += `Buat workbook bertema "${tema.value}" dengan latihan sederhana dan tugas refleksi.\n`;
}
else if(outputType.value === "script"){
hasil += `🎬 SCRIPT VIDEO\n\n`;
hasil += `Buat script video edukasi bertema "${tema.value}" untuk anak usia ${usia.value || "-"}.\n`;
}
}
else{
hasil += `Judul: ${judul.value || "-"}\n`;
hasil += `Mode: ${modeVal}\n`;
hasil += `Tema: ${tema.value || "-"}\n`;

if(modeVal === "iklan"){
hasil += `Produk: ${produk.value || "-"}\n`;
}

hasil += "\n";

let struktur = ["HOOK","KONFLIK","EMOSI NAIK","TITIK TERENDAH","ENDING"];

for(let i = 1; i <= parseInt(scene.value, 10); i++){

let title = struktur[i - 1] || "SCENE";

let visual = `${karakterFinal}, ${tema.value}, ${styleFinal}, cinematic lighting, ultra detail`;
let i2v = "cinematic movement, auto zoom dialog";

if(karakterFinal === "Tanpa Karakter" || karakter.value === "none"){
visual = `${tema.value}, ${styleFinal}, cinematic lighting, ultra detail, no character`;
}

let vo = "";

if(i === 1){
vo = `"${judul.value || "Semua berubah"}... semuanya berubah sejak hari itu..."`;
}
else if(i === 2){
vo = `"Awalnya terasa biasa saja..."`;
}
else if(i === 3){
vo = `"Tapi perlahan, semuanya mulai berbeda..."`;
}
else if(i === 4){
vo = `"${karakterFinal} mulai merasa ${String(emosiFinal).toLowerCase()}..."`;
}
else if(i === 5){
vo = `"Kenangan itu kembali muncul di pikirannya..."`;
}
else if(i === 6){
vo = `"Seandainya waktu bisa diulang..."`;
}
else if(i === 7){
vo = `"Ini semua salahku..."`;
}
else if(i === 8){
vo = `"${karakterFinal} tak bisa menahan perasaan lagi..."`;
}
else if(i === 9){
vo = `"Penyesalan itu datang terlambat..."`;
}
else if(i === 10){
vo = `"Kalau waktu bisa diulang... aku akan memilih berbeda..."`;
}
else{
vo = `"${karakterFinal} terdiam dalam ${String(emosiFinal).toLowerCase()}..."`;
}

hasil += `🎬 SCENE ${i} — ${title}\n\n`;
hasil += `Visual:\n${visual}\n\n`;
hasil += `I2V:\n${i2v}\n\n`;
hasil += `VO:\n${vo}\n\n`;
hasil += "====================\n\n";
}
}

output.innerText = hasil;

credit--;
localStorage.setItem("ai_credit", credit);
updateCredit();
}

function copyText(){
navigator.clipboard.writeText(output.innerText);
alert("Copied");
}

updateCredit();
mode.onchange();
karakter.onchange();
emosi.onchange();
style.onchange();
</script>

</body>
</html>
