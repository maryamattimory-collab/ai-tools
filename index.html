<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
text-align:center;
max-width:700px;
padding:40px;
}

h1{font-size:42px;margin-bottom:10px;}
.sub{color:#94a3b8;margin-bottom:25px;}

.card{
background:#1e293b;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}

.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}

.feature{
background:#020617;
padding:10px;
border-radius:8px;
font-size:13px;
color:#94a3b8;
}

input, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
outline:none;
}

button{
background:#38bdf8;
border:none;
padding:14px 20px;
font-size:15px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
margin:5px;
}

button:hover{background:#0ea5e9;}

.output{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;
white-space:pre-line;
font-size:14px;
}

.footer{
margin-top:15px;
color:#64748b;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 AI Studio Pro</h1>
<div class="sub">Generator Film, Iklan, Edukasi AI</div>

<div class="card">

<div id="userInfo" style="margin-bottom:5px;font-size:13px;color:#94a3b8;">
Belum login
</div>

<div id="creditInfo" style="margin-bottom:10px;color:#38bdf8;font-weight:bold;">
Credit: 0
</div>

<button onclick="login()">Login Google</button>
<button onclick="logout()">Logout</button>

<select id="mode">
<option value="film" selected>🎬 AI Film</option>
<option value="iklan">💰 AI Iklan</option>
<option value="edukasi">🧠 AI Edukasi</option>
</select>

<input type="text" id="judul" placeholder="Judul">
<input type="text" id="tema" placeholder="Tema">
<input type="text" id="produk" placeholder="Produk (khusus iklan)" style="display:none;">

<select id="scene">
<option value="3" selected>3 Scene</option>
<option value="5">5 Scene</option>
<option value="7">7 Scene</option>
<option value="10">10 Scene</option>
</select>

<select id="emosi">
<option selected>Sedih</option>
<option>Haru</option>
<option>Bahagia</option>
<option>Religius</option>
<option>Tegang</option>
<option>Ketakutan</option>
<option>Ceria</option>
<option>Seru</option>
<option>Pertualangan</option>
</select>

<select id="karakter">
<option selected>Ibu & Anak</option>
<option>Anak</option>
<option>Remaja</option>
<option>Hewan</option>
<option>Buah</option>
<option>Sayur</option>
</select>

<select id="style">
<option selected>Realistic Cinematic</option>
<option>3D Pixar</option>
<option>Anime</option>
<option>Kartun Anak</option>
<option>Studio Ghibli</option>
<option>Skeleton Cute</option>
</select>

<button onclick="generate()">🎬 Generate</button>

<div id="output" class="output"></div>

</div>

<div class="card">
<h4>Tools AI</h4>

<div class="features">
<div class="feature">Infografis Generator</div>
<div class="feature">TikTok Carousel</div>
<div class="feature">Leonardo Prompt</div>
<div class="feature">Veo Video Prompt</div>
<div class="feature">Analyze Video</div>
<div class="feature">Gabungkan Foto</div>
</div>

<a href="/chat.html">
<button>Masuk ke AI Tools</button>
</a>
</div>

<div class="footer">AI Studio Pro</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// CONFIG KAMU (SUDAH BENAR)
const firebaseConfig = {
  apiKey: "AIzaSyAE3bS-37GES03FORAuWu9C8JXs9OJq-xo",
  authDomain: "ai-studio-pro-2a0b8.firebaseapp.com",
  projectId: "ai-studio-pro-2a0b8",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let credit = 0;

// LOGIN
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

// LOGOUT
function logout(){
  auth.signOut();
}

// USER STATE
auth.onAuthStateChanged(async user => {
  if(user){
    currentUser = user;
    document.getElementById("userInfo").innerText = user.email;

    const ref = db.collection("users").doc(user.uid);
    const doc = await ref.get();

    if(!doc.exists){
      await ref.set({credit:10});
      credit = 10;
    } else {
      credit = doc.data().credit;
    }

    updateCreditDisplay();

  } else {
    currentUser = null;
    document.getElementById("userInfo").innerText = "Belum login";
    document.getElementById("creditInfo").innerText = "Login dulu";
  }
});

// UPDATE UI
function updateCreditDisplay(){
  document.getElementById("creditInfo").innerText = "Credit: " + credit;
}

// MODE IKLAN
document.getElementById("mode").addEventListener("change", function(){
  let produk = document.getElementById("produk");
  produk.style.display = (this.value === "iklan") ? "block" : "none";
});

// GENERATE
async function generate(){

if(!currentUser){
alert("Login dulu ya!");
return;
}

if(credit <= 0){
alert("Credit habis!");
return;
}

const ref = db.collection("users").doc(currentUser.uid);

// POTONG CREDIT
await ref.update({credit: credit - 1});
credit--;
updateCreditDisplay();

const mode = document.getElementById('mode').value;
const judul = document.getElementById('judul').value;
const tema = document.getElementById('tema').value;
const produk = document.getElementById('produk').value;
const scene = parseInt(document.getElementById('scene').value);
const emosi = document.getElementById('emosi').value;
const karakter = document.getElementById('karakter').value;
const style = document.getElementById('style').value;

let hasil = `🎬 ${judul}\nMode: ${mode}\nTema: ${tema}\n`;

if(mode === "iklan"){
hasil += `Produk: ${produk}\n\n`;
}

for(let i=1;i<=scene;i++){

let baseVisual = `${karakter}, ${tema}`;

if(mode === "edukasi"){
baseVisual = `${karakter} object talk (humanized)`;
}

if(mode === "iklan"){
baseVisual = `${produk} sebagai fokus utama`;
}

hasil += `SCENE ${i}\n`;
hasil += `Visual: ${baseVisual}, style ${style}, cinematic, mood ${emosi}, lighting dramatic\n`;
hasil += `Prompt T2I: ${baseVisual}, ${style}, ultra detailed, cinematic lighting, depth of field, 35mm film\n`;
hasil += `Prompt I2V: cinematic motion, emotional ${emosi}, smooth camera movement\n`;
hasil += `Voice Over: Narasi scene ${i} dengan nuansa ${emosi}\n\n`;
}

document.getElementById("output").innerText = hasil;

}

</script>

</body>
</html>
