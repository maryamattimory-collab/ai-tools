<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
text-align:center;
max-width:750px;
padding:40px;
}

h1{font-size:42px;margin-bottom:10px;}
.sub{color:#94a3b8;margin-bottom:25px;}

.card{
background:#1e293b;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}

.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}

.feature{
background:#020617;
padding:10px;
border-radius:8px;
font-size:13px;
color:#94a3b8;
}

input, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
outline:none;
}

button{
background:#38bdf8;
border:none;
padding:14px 20px;
font-size:15px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
margin:5px;
}

button:hover{background:#0ea5e9;}
.copy-btn{background:#22c55e;}

.output{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;
white-space:pre-line;
font-size:14px;
}

.footer{
margin-top:15px;
color:#64748b;
font-size:12px;
}

.extra{display:none;}
</style>
</head>

<body>

<div class="container">

<h1>🎬 AI Studio Pro</h1>
<div class="sub">Generator Film, Iklan, Edukasi AI</div>

<div class="card">

<div id="creditInfo" style="margin-bottom:5px;color:#38bdf8;font-weight:bold;">
Credit: 10
</div>

<div style="font-size:12px;color:#94a3b8;margin-bottom:10px;">
Free 10 credit / hari • Premium tanpa batas
</div>

<select id="template">
<option value="">🎯 Pilih Ide (Opsional)</option>
<option value="ibu">Ibu & Anak Menyesal</option>
<option value="horor">Horor Seram</option>
<option value="iklan">Iklan Produk Lucu</option>
<option value="edukasi">Edukasi Buah / Object Talk</option>
<option value="clay">🔥 Clay Viral Story</option>
</select>

<select id="mode">
<option value="film">🎬 AI Film</option>
<option value="iklan">💰 AI Iklan</option>
<option value="edukasi">🧠 AI Edukasi</option>
<option value="edukasi_pro">📚 Edukasi Pro</option>
</select>

<input type="text" id="judul" placeholder="Judul">
<input type="text" id="tema" placeholder="Tema">

<input type="text" id="produk" placeholder="Nama Produk" style="display:none;">
<input type="file" id="produkImg" accept="image/*" style="display:none;">

<div id="edukasiProBox" class="extra">
<select id="outputType">
<option value="storybook">Storybook</option>
<option value="lkpd">LKPD</option>
<option value="komik">Komik</option>
<option value="workbook">Workbook</option>
<option value="script">Script Video</option>
</select>

<input type="text" id="usia" placeholder="Usia anak">
<input type="text" id="tujuan" placeholder="Tujuan pembelajaran">
</div>

<select id="scene">
<option value="3">3 Scene</option>
<option value="5">5 Scene</option>
<option value="7">7 Scene</option>
<option value="10" selected>10 Scene</option>
</select>

<select id="emosi">
<option>Sedih</option>
<option>Haru</option>
<option>Bahagia</option>
<option>Religius</option>
<option>Tegang</option>
<option selected>Ketakutan</option>
<option>Ceria</option>
<option>Seru</option>
<option>Pertualangan</option>
<option value="custom">Custom</option>
</select>
<input type="text" id="customEmosi" placeholder="Emosi custom..." style="display:none;">

<select id="karakter">
<option>Ibu & Anak</option>
<option>Ibu</option>
<option>Anak</option>
<option>Remaja</option>
<option>Hewan</option>
<option>Buah</option>
<option>Sayur</option>
<option value="custom">Custom</option>
<option value="none">Tanpa Karakter</option>
</select>
<input type="text" id="customKarakter" placeholder="Karakter custom..." style="display:none;">

<select id="style">
<option>Realistic Cinematic</option>
<option>3D Pixar</option>
<option>Anime</option>
<option>Kartun Anak</option>
<option>Studio Ghibli</option>
<option>Skeleton Cute</option>
<option value="custom">Custom</option>
</select>
<input type="text" id="customStyle" placeholder="Style custom..." style="display:none;">

<button onclick="generate()">🎬 Generate</button>
<button class="copy-btn" onclick="copyText()">📋 Copy</button>

<div id="output" class="output"></div>

</div>

<div class="card">
<h4>Tools AI</h4>

<div class="features">
<div class="feature">Infografis Generator</div>
<div class="feature">TikTok Carousel</div>
<div class="feature">Leonardo Prompt</div>
<div class="feature">Veo Video Prompt</div>
<div class="feature">Analyze Video</div>
</div>

<a href="/chat.html">
<button>Masuk ke AI Tools</button>
</a>
</div>

<div class="footer">AI Studio Pro</div>

</div>

<script>

// CREDIT
let credit = localStorage.getItem("ai_credit");
if(credit === null){
credit = 10;
localStorage.setItem("ai_credit", credit);
}else{
credit = parseInt(credit);
}

// RESET HARIAN
let today = new Date().toDateString();
if(localStorage.getItem("last_reset") !== today){
credit = 10;
localStorage.setItem("ai_credit", credit);
localStorage.setItem("last_reset", today);
}

function updateCredit(){
document.getElementById("creditInfo").innerText = "Credit: " + credit;
}

// MODE
mode.onchange = function(){
produk.style.display = this.value==="iklan"?"block":"none";
produkImg.style.display = this.value==="iklan"?"block":"none";
edukasiProBox.style.display = this.value==="edukasi_pro"?"block":"none";
};

// TEMPLATE
template.onchange = function(){

if(this.value==="ibu"){
judul.value="Anak Menyesal";
tema.value="Anak durhaka kepada ibu lalu menyesal";
emosi.value="Sedih";
}

if(this.value==="horor"){
judul.value="Malam Terakhir";
tema.value="Rumah angker penuh misteri";
emosi.value="Ketakutan";
}

if(this.value==="iklan"){
mode.value="iklan";
judul.value="Produk Ajaib";
tema.value="Produk membantu kehidupan sehari-hari";
}

if(this.value==="edukasi"){
mode.value="edukasi";
judul.value="Belajar Seru";
tema.value="Edukasi anak";
}

if(this.value==="clay"){
mode.value="film";
judul.value="Ibu yang Terlupakan";
tema.value="Anak sibuk hingga melupakan ibunya lalu menyesal";
emosi.value="Sedih";
style.value="Realistic Cinematic";
}

};

// CUSTOM
karakter.onchange = ()=>customKarakter.style.display = karakter.value==="custom"?"block":"none";
emosi.onchange = ()=>customEmosi.style.display = emosi.value==="custom"?"block":"none";
style.onchange = ()=>customStyle.style.display = style.value==="custom"?"block":"none";

function generate(){

if(credit<=0){
alert("Credit habis!");
return;
}

let hasil="🔥 READY TO USE SCRIPT\n\n";
let modeVal = mode.value;

let karakterFinal = karakter.value==="custom" ? (customKarakter.value||"karakter") : karakter.value;
let emosiFinal = emosi.value==="custom" ? (customEmosi.value||"emosional") : emosi.value;
let styleFinal = style.value==="custom" ? (customStyle.value||"cinematic") : style.value;

// CLAY BOOST
if(template.value==="clay"){
styleFinal += ", clay animation, soft texture, emotional lighting, cinematic clay render";
}

hasil += `🎬 ${judul.value}\nMode: ${modeVal}\nTema: ${tema.value}\n\n`;

let maxScene = Math.min(parseInt(scene.value),10);

if(maxScene===10){
hasil += "🔥 Mode full cinematic aktif\n\n";
}

for(let i=1;i<=maxScene;i++){

let base = karakterFinal==="none"
? `${tema.value}, ${styleFinal}`
: `${karakterFinal}, ${tema.value}, ${styleFinal}`;

let adaDialog = (i%2!==0);
let i2v = "cinematic motion";
if(adaDialog) i2v += ", auto zoom dialog";

let vo = "narasi " + emosiFinal;

if(template.value==="clay"){
if(i==1) vo="Hook emosional kuat";
if(i==maxScene) vo="Ending sedih menyentuh";
}

hasil += `SCENE ${i}\n`;
hasil += `Visual: ${base}\n`;
hasil += `I2V: ${i2v}\n`;
hasil += `VO: ${vo}\n\n`;

}

output.innerText = hasil;

credit--;
localStorage.setItem("ai_credit",credit);
updateCredit();

}

function copyText(){
navigator.clipboard.writeText(output.innerText);
alert("Copied");
}

updateCredit();

</script>

</body>
</html>
