<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
text-align:center;
max-width:700px;
padding:40px;
}

h1{
font-size:42px;
margin-bottom:10px;
}

.sub{
color:#94a3b8;
margin-bottom:25px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}

.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}

.feature{
background:#020617;
padding:10px;
border-radius:8px;
font-size:13px;
color:#94a3b8;
}

input, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
outline:none;
}

button{
background:#38bdf8;
border:none;
padding:14px 20px;
font-size:15px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
margin:5px;
}

button:hover{
background:#0ea5e9;
}

.output{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;
white-space:pre-line;
font-size:14px;
}

.footer{
margin-top:15px;
color:#64748b;
font-size:12px;
}

</style>

</head>

<body>

<div class="container">

<h1>🎬 AI Film Generator</h1>

<div class="sub">
Buat cerita film otomatis lengkap dengan visual, style, dan voice over
</div>

<div class="card">

<h3>🔥 Pilih Cepat:</h3>

<button onclick="preset('Anak Durhaka','Sedih')">Anak Durhaka</button>
<button onclick="preset('Ibu Sabar','Haru')">Ibu Sabar</button>
<button onclick="preset('Anak Menyesal','Sedih')">Anak Menyesal</button>
<button onclick="preset('Cerita Islami','Religius')">Islami</button>
<button onclick="preset('Cerita Horor','Tegang')">Horor</button>

<br><br>

<input type="text" id="judul" placeholder="Judul Cerita">
<input type="text" id="tema" placeholder="Tema (bebas: horor, cinta, islami, dll)">

<select id="scene">
<option value="3">3 Scene</option>
<option value="5">5 Scene</option>
<option value="7">7 Scene</option>
<option value="10">10 Scene</option>
</select>

<select id="emosi">
<option>Sedih</option>
<option>Haru</option>
<option>Bahagia</option>
<option>Religius</option>
<option>Tegang</option>
</select>

<select id="karakter">
<option>Ibu & Anak</option>
<option>Anak</option>
<option>Remaja</option>
<option>Hewan</option>
</select>

<select id="style">
<option>3D Pixar</option>
<option>Anime</option>
<option>Realistis Cinematic</option>
<option>Kartun Anak</option>
<option>Studio Ghibli</option>
</select>

<button onclick="generate()">🎬 Buat Film Sekarang</button>

<div id="output" class="output"></div>

</div>

<div class="card">

<h4>Tools Lainnya</h4>

<div class="features">
<div class="feature">Infografis Generator</div>
<div class="feature">TikTok Carousel</div>
<div class="feature">Leonardo Prompt</div>
<div class="feature">Veo Video Prompt</div>
<div class="feature">Analyze Video</div>
<div class="feature">Gabungkan Foto</div>
</div>

<a href="/chat.html">
<button>Masuk ke AI Tools</button>
</a>

</div>

<div class="footer">
AI Studio Pro • Powered by Gemini
</div>

</div>

<script>

function preset(judul, emosi){
document.getElementById('judul').value = judul;
document.getElementById('tema').value = judul;
document.getElementById('emosi').value = emosi;
}

function generate(){

const judul = document.getElementById('judul').value || "Tanpa Judul";
const tema = document.getElementById('tema').value || "Tema Umum";
const totalScene = parseInt(document.getElementById('scene').value) || 3;
const emosi = document.getElementById('emosi').value;
const karakter = document.getElementById('karakter').value;
const style = document.getElementById('style').value;

let alur = [
"Perkenalan karakter",
"Kehidupan awal yang tenang",
"Muncul konflik kecil",
"Masalah mulai membesar",
"Ketegangan meningkat",
"Titik terendah karakter",
"Puncak konflik (klimaks)",
"Momen kesadaran",
"Mulai perubahan",
"Ending menyentuh"
];

let hasil = `🎬 ${judul}\n\nStyle Visual: ${style}\nTema: ${tema}\n\n`;

for(let i=1;i<=totalScene;i++){

let posisi = alur[i-1] || "Kelanjutan cerita";

hasil += `SCENE ${i}\n`;
hasil += `Deskripsi: ${posisi}\n`;
hasil += `Visual: ${karakter} dalam cerita ${tema}, gaya ${style}, cinematic lighting\n`;
hasil += `Prompt T2I: ${karakter}, ${tema}, ${style}, highly detailed, cinematic, dramatic lighting\n`;
hasil += `Prompt I2V: cinematic video, ${emosi}, smooth camera movement, emotional storytelling\n`;
hasil += `Voice Over: Narasi ${emosi} pada bagian ${posisi}\n`;
hasil += `------------------------\n\n`;

}

document.getElementById("output").innerText = hasil;

}

</script>

</body>
</html>
