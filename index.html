<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
text-align:center;
max-width:700px;
padding:40px;
}

h1{font-size:42px;margin-bottom:10px;}
.sub{color:#94a3b8;margin-bottom:25px;}

.card{
background:#1e293b;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}

.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}

.feature{
background:#020617;
padding:10px;
border-radius:8px;
font-size:13px;
color:#94a3b8;
}

input, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
outline:none;
}

button{
background:#38bdf8;
border:none;
padding:14px 20px;
font-size:15px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
margin:5px;
}

button:hover{background:#0ea5e9;}

.output{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;
white-space:pre-line;
font-size:14px;
}

.footer{
margin-top:15px;
color:#64748b;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 AI Studio Pro</h1>
<div class="sub">Generator Film, Iklan, Edukasi AI</div>

<div class="card">

<div id="creditInfo" style="margin-bottom:10px;color:#38bdf8;font-weight:bold;">
Credit: 10
</div>

<!-- TEMPLATE -->
<select id="template">
<option value="">🎯 Pilih Ide (Opsional)</option>
<option value="ibu">Ibu & Anak Menyesal</option>
<option value="horor">Horor Seram</option>
<option value="iklan">Iklan Produk Lucu</option>
<option value="edukasi">Edukasi Buah / Object Talk</option>
</select>

<select id="mode">
<option value="film" selected>🎬 AI Film</option>
<option value="iklan">💰 AI Iklan</option>
<option value="edukasi">🧠 AI Edukasi</option>
</select>

<input type="text" id="judul" placeholder="Judul">
<input type="text" id="tema" placeholder="Tema">
<input type="text" id="produk" placeholder="Produk (khusus iklan)" style="display:none;">

<select id="scene">
<option value="3">3 Scene</option>
<option value="5">5 Scene</option>
<option value="7">7 Scene</option>
<option value="10" selected>10 Scene</option>
</select>

<select id="emosi">
<option>Sedih</option>
<option>Haru</option>
<option>Bahagia</option>
<option>Religius</option>
<option>Tegang</option>
<option selected>Ketakutan</option>
<option>Ceria</option>
<option>Seru</option>
<option>Pertualangan</option>
</select>

<select id="karakter">
<option selected>Ibu & Anak</option>
<option>Anak</option>
<option>Remaja</option>
<option>Hewan</option>
<option>Buah</option>
<option>Sayur</option>
</select>

<select id="style">
<option selected>Realistic Cinematic</option>
<option>3D Pixar</option>
<option>Anime</option>
<option>Kartun Anak</option>
<option>Studio Ghibli</option>
<option>Skeleton Cute</option>
</select>

<button onclick="generate()">🎬 Generate</button>

<div id="output" class="output"></div>

</div>

<div class="card">
<h4>Tools AI</h4>

<div class="features">
<div class="feature">Infografis Generator</div>
<div class="feature">TikTok Carousel</div>
<div class="feature">Leonardo Prompt</div>
<div class="feature">Veo Video Prompt</div>
<div class="feature">Analyze Video</div>
<div class="feature">Gabungkan Foto</div>
</div>

<a href="/chat.html">
<button>Masuk ke AI Tools</button>
</a>
</div>

<div class="footer">AI Studio Pro</div>

</div>

<script>

// CREDIT
let credit = localStorage.getItem("ai_credit");
if(credit === null){
credit = 10;
localStorage.setItem("ai_credit", credit);
}else{
credit = parseInt(credit);
}

function updateCredit(){
document.getElementById("creditInfo").innerText = "Credit: " + credit;
}

// TEMPLATE AUTO FILL
document.getElementById("template").addEventListener("change", function(){

const val = this.value;

if(val === "ibu"){
judul.value = "Anak Menyesal";
tema.value = "Anak durhaka kepada ibu lalu menyesal";
emosi.value = "Sedih";
karakter.value = "Ibu & Anak";
mode.value = "film";
}

if(val === "horor"){
judul.value = "Malam Terakhir";
tema.value = "Rumah angker penuh misteri";
emosi.value = "Ketakutan";
karakter.value = "Remaja";
mode.value = "film";
}

if(val === "iklan"){
judul.value = "Mie Ajaib";
tema.value = "Mie instan dimasak makhluk misterius";
emosi.value = "Seru";
karakter.value = "Remaja";
mode.value = "iklan";
}

if(val === "edukasi"){
judul.value = "Buah Bisa Bicara";
tema.value = "Buah mengajarkan anak makan sehat";
emosi.value = "Ceria";
karakter.value = "Buah";
mode.value = "edukasi";
}

});

// MODE IKLAN
document.getElementById("mode").addEventListener("change", function(){
document.getElementById("produk").style.display =
this.value === "iklan" ? "block" : "none";
});

// GENERATE
function generate(){

if(credit <= 0){
alert("Credit habis!");
return;
}

const mode = modeEl.value;
const judul = judulEl.value;
const tema = temaEl.value;
const produk = produkEl.value;
const scene = parseInt(sceneEl.value);
const emosi = emosiEl.value;
const karakter = karakterEl.value;
const style = styleEl.value;

let hasil = `🎬 ${judul}\nMode: ${mode}\nTema: ${tema}\n`;

if(mode==="iklan") hasil += `Produk: ${produk}\n\n`;

for(let i=1;i<=scene;i++){

let base = `${karakter}, ${tema}`;

if(mode==="edukasi") base = `${karakter} object talk (humanized)`;
if(mode==="iklan") base = `${produk} fokus utama`;

hasil += `SCENE ${i}\n`;
hasil += `Visual: ${base}, ${style}, mood ${emosi}\n`;
hasil += `T2I: ${base}, cinematic\n`;
hasil += `I2V: cinematic motion\n`;
hasil += `VO: Narasi ${emosi}\n\n`;

}

output.innerText = hasil;

credit--;
localStorage.setItem("ai_credit", credit);
updateCredit();

}

updateCredit();

</script>

</body>
</html>
