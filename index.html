<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Pro</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}
.container{
text-align:center;
max-width:750px;
padding:40px;
}
h1{font-size:42px;margin-bottom:10px;}
.sub{color:#94a3b8;margin-bottom:25px;}
.card{
background:#1e293b;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}
.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}
.feature{
background:#020617;
padding:10px;
border-radius:8px;
font-size:13px;
color:#94a3b8;
}
input, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
outline:none;
}
button{
background:#38bdf8;
border:none;
padding:14px 20px;
font-size:15px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
margin:5px;
}
button:hover{background:#0ea5e9;}
.copy-btn{background:#22c55e;}
.output{
background:#020617;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;
white-space:pre-line;
font-size:14px;
}
.footer{
margin-top:15px;
color:#64748b;
font-size:12px;
}
.extra{display:none;}
</style>
</head>

<body>

<div class="container">

<h1>🎬 AI Studio Pro</h1>
<div class="sub">Generator Film, Iklan, Edukasi AI</div>

<div class="card">

<div id="creditInfo" style="margin-bottom:5px;color:#38bdf8;font-weight:bold;">
Credit: 10
</div>

<div style="font-size:12px;color:#94a3b8;margin-bottom:10px;">
Free 10 credit / hari • Premium tanpa batas
</div>

<select id="template">
<option value="">🎯 Pilih Ide</option>
<option value="ibu">Ibu & Anak Menyesal</option>
<option value="horor">Horor Seram</option>
<option value="iklan">Iklan Produk</option>
<option value="edukasi">Edukasi</option>
<option value="clay">🔥 Clay Viral Story</option>
</select>

<select id="mode">
<option value="film">🎬 Film</option>
<option value="iklan">💰 Iklan</option>
<option value="edukasi">🧠 Edukasi</option>
<option value="edukasi_pro">📚 Edukasi Pro</option>
</select>

<input id="judul" placeholder="Judul">
<input id="tema" placeholder="Tema">

<input id="produk" placeholder="Nama Produk" style="display:none;">
<input type="file" id="produkImg" style="display:none;">

<select id="scene">
<option>3</option>
<option>5</option>
<option>7</option>
<option selected>10</option>
</select>

<select id="emosi">
<option>Sedih</option>
<option>Bahagia</option>
<option>Tegang</option>
<option value="custom">Custom</option>
</select>
<input id="customEmosi" placeholder="Custom emosi" style="display:none;">

<select id="karakter">
<option>Ibu & Anak</option>
<option>Ibu</option>
<option>Anak</option>
<option value="custom">Custom</option>
<option value="none">Tanpa Karakter</option>
</select>
<input id="customKarakter" placeholder="Custom karakter" style="display:none;">

<select id="style">
<option>Realistic Cinematic</option>
<option>3D Pixar</option>
<option>Anime</option>
<option value="custom">Custom</option>
</select>
<input id="customStyle" placeholder="Custom style" style="display:none;">

<button onclick="generate()">🎬 Generate</button>
<button class="copy-btn" onclick="copyText()">📋 Copy</button>

<div id="output" class="output"></div>

</div>

<div class="footer">AI Studio Pro</div>

</div>

<script>

let credit = localStorage.getItem("ai_credit") || 10;

function updateCredit(){
document.getElementById("creditInfo").innerText="Credit: "+credit;
}

// TEMPLATE
template.onchange=function(){

if(this.value==="ibu"){
judul.value="Anak Menyesal";
tema.value="Durhaka lalu menyesal";
emosi.value="Sedih";
}

if(this.value==="horor"){
judul.value="Rumah Terakhir";
tema.value="Teror misterius";
emosi.value="Tegang";
}

if(this.value==="iklan"){
mode.value="iklan";
}

if(this.value==="clay"){
judul.value="Ibu yang Terlupakan";
tema.value="Anak melupakan ibu";
emosi.value="Sedih";
}

};

// CUSTOM
karakter.onchange=()=>customKarakter.style.display=karakter.value==="custom"?"block":"none";
emosi.onchange=()=>customEmosi.style.display=emosi.value==="custom"?"block":"none";
style.onchange=()=>customStyle.style.display=style.value==="custom"?"block":"none";

// GENERATE
function generate(){

if(credit<=0){
alert("Credit habis!");
return;
}

let hasil="🔥 SCRIPT SIAP PRODUKSI\n\n";

let karakterFinal=karakter.value==="custom"?customKarakter.value:karakter.value;
let emosiFinal=emosi.value==="custom"?customEmosi.value:emosi.value;
let styleFinal=style.value==="custom"?customStyle.value:style.value;

// CLAY
if(template.value==="clay"){
styleFinal+=" clay animation cinematic";
}

let struktur=[
"HOOK","KOMEN","KONFLIK","EMOSI NAIK","FLASHBACK",
"PIKIRAN DALAM","TITIK TERENDAH","PENYESALAN","PESAN","ENDING"
];

let maxScene=parseInt(scene.value);

for(let i=1;i<=maxScene;i++){

let title=struktur[i-1]||"SCENE";

let visual = `${karakterFinal}, ${tema.value}, ${styleFinal}, natural look, expressive face, emotional, cinematic lighting, soft shadows, ultra detailed, depth of field, 35mm lens`;
let vo="narasi "+emosiFinal;
let i2v=i%2?"auto zoom dialog":"slow pan";

if(i===1) vo="Hook kuat";
if(i===maxScene) vo="Ending emosional";

hasil+=`🎬 SCENE ${i} — ${title}\n`;
hasil+=`Visual:\n${visual}\n\n`;
hasil+=`I2V:\n${i2v}\n\n`;
hasil+=`VO:\n${vo}\n\n`;
hasil+="====================\n\n";

}

output.innerText=hasil;

credit--;
localStorage.setItem("ai_credit",credit);
updateCredit();

}

function copyText(){
navigator.clipboard.writeText(output.innerText);
alert("Copied");
}

updateCredit();

</script>

</body>
</html>
